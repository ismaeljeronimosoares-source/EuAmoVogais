<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
    <title>LINGO LINGO CRIANÇAS</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        :root {
            --clay-shadow: 0 8px 0 rgba(0,0,0,0.15), 0 12px 20px -4px rgba(0,0,0,0.2), inset 0 2px 6px rgba(255,255,255,0.7), inset 0 -3px 8px rgba(0,0,0,0.1);
            --clay-shadow-sm: 0 4px 0 rgba(0,0,0,0.12), 0 6px 12px -2px rgba(0,0,0,0.15), inset 0 1px 3px rgba(255,255,255,0.6), inset 0 -2px 4px rgba(0,0,0,0.08);
            --bg-body: #c8ece4;
            --bg-shell: rgba(255,255,255,0.94);
            --text-color: #1a2a3a;
        }
        body {
            background: var(--bg-body);
            font-family: 'Nunito', 'Fredoka', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            text-transform: uppercase;
            transition: background 0.5s, transform 0.08s;
        }
        .app-shell {
            max-width: 520px;
            width: 100%;
            height: 96vh;
            background: var(--bg-shell);
            backdrop-filter: blur(14px);
            border-radius: 56px;
            box-shadow: 0 30px 60px -15px rgba(0,0,0,0.22);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: background 0.5s;
        }
        .screen {
            display: none;
            flex-direction: column;
            padding: 1.5rem;
            flex: 1;
            overflow-y: auto;
            gap: 1rem;
        }
        .screen.active {
            display: flex;
        }
        .title-lg {
            font-family: 'Fredoka', sans-serif;
            font-size: 2.6rem;
            font-weight: 700;
            color: #1a9e8a;
            text-align: center;
            letter-spacing: 3px;
            animation: titleBounce 2s ease-in-out infinite;
        }
        .title-lg .letter {
            display: inline-block;
            animation: letterWave 1.5s ease-in-out infinite;
        }
        .title-lg .letter:nth-child(odd) {
            animation-delay: 0.1s;
        }
        .title-lg .letter:nth-child(even) {
            animation-delay: 0.2s;
        }
        @keyframes letterWave {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-8px);
            }
        }
        @keyframes titleBounce {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.03);
            }
        }
        .title-emoji {
            display: inline-block;
            animation: emojiFly 1.8s ease-in-out infinite;
            font-size: 3rem;
        }
        @keyframes emojiFly {
            0%,
            100% {
                transform: translateY(0) rotate(0deg);
            }
            25% {
                transform: translateY(-12px) rotate(-8deg);
            }
            75% {
                transform: translateY(-6px) rotate(8deg);
            }
        }
        .title-md {
            font-family: 'Fredoka', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-color);
            text-align: center;
        }
        .feedback-text {
            font-family: 'Fredoka', sans-serif;
            font-size: 1.4rem;
            font-weight: 700;
            min-height: 36px;
            text-align: center;
            color: #1a9e8a;
        }
        .clay-btn {
            border: none;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
            font-weight: 900;
            font-size: 1rem;
            border-radius: 32px;
            transition: all 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 0.8rem;
            color: #fff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
            box-shadow: var(--clay-shadow);
            letter-spacing: 0.5px;
            gap: 6px;
            min-height: 80px;
            word-break: break-word;
        }
        .clay-btn:active {
            transform: scale(0.93) translateY(4px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.1), 0 4px 8px rgba(0,0,0,0.1), inset 0 1px 3px rgba(255,255,255,0.4);
        }
        .btn-back {
            background: #f0f4f8;
            border: none;
            border-radius: 40px;
            font-weight: 900;
            padding: 0.7rem 1.2rem;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
            font-size: 0.95rem;
            color: #1a2a3a;
            box-shadow: var(--clay-shadow-sm);
            align-self: flex-start;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .home-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 1rem;
        }
        .home-grid .span-2 {
            grid-column: span 2;
        }

        /* MASCOTE INTERATIVO */
        #mascot {
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-size: 3.5rem;
            cursor: pointer;
            transition: transform 0.2s;
            z-index: 100;
            background: #ffffffdd;
            border-radius: 50%;
            width: 65px;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--clay-shadow-sm);
            animation: mascotBounce 2s ease-in-out infinite;
        }
        @keyframes mascotBounce {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }
        #mascot:active {
            transform: scale(1.2) rotate(10deg);
        }

        /* PARTÍCULAS GLOBAIS */
        .particle {
            position: fixed;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            z-index: 9999;
            pointer-events: none;
            animation: particleFly 0.7s ease-out forwards;
        }
        @keyframes particleFly {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--dx), var(--dy)) scale(0);
            }
        }
        
        @keyframes loading {
            0% {
                width: 0%;
            }
            50% {
                width: 100%;
            }
            100% {
                width: 0%;
            }
        }

        /* PINTURA */
        .color-palette {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 8px 0;
        }
        .color-swatch {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 3px solid #fff;
            box-shadow: 0 3px 6px rgba(0,0,0,0.2);
            cursor: pointer;
            transition: transform 0.15s, border-color 0.15s;
        }
        .color-swatch.active {
            border-color: #1a2a3a;
            transform: scale(1.2);
            box-shadow: 0 0 0 4px #fbbf24;
        }
        .outline-buttons {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .outline-btn {
            background: #f0f4f8;
            border: 2px solid #cbd5e1;
            border-radius: 16px;
            font-size: 2.2rem;
            padding: 0.5rem 0.9rem;
            cursor: pointer;
            box-shadow: var(--clay-shadow-sm);
            transition: all 0.1s;
            min-width: 60px;
        }
        .outline-btn.active {
            background: #fef3c7;
            border-color: #f59e0b;
        }

        /* HISTÓRIAS - BIBLIOTECA */
        .story-library {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        }
        .story-card {
            background: #fef9e7;
            border-radius: 24px;
            padding: 1rem;
            box-shadow: var(--clay-shadow-sm);
            cursor: pointer;
            width: 130px;
            text-align: center;
            font-size: 1rem;
            transition: transform 0.15s;
            font-weight: 700;
            text-transform: none;
        }
        .story-card:hover {
            transform: scale(1.05);
        }
        .story-card .story-icon {
            font-size: 3rem;
        }

        /* CORRIDA */
        #runnerContainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            z-index: 1000;
            background: linear-gradient(180deg, #87ceeb 0%, #a8e6cf 50%, #fff3cd 100%);
            overflow: hidden;
            touch-action: manipulation;
        }
        .runner-player {
            position: absolute;
            bottom: 200px;
            width: 80px;
            height: 80px;
            border-radius: 25px;
            background: #ffffffdd;
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            box-shadow: var(--clay-shadow-sm);
            transition: left 0.1s ease;
            z-index: 10;
            overflow: visible;
        }
        .runner-player img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 25px;
        }
        .runner-player.invincible {
            animation: invincibleBlink 0.3s infinite alternate, glowPulse 0.5s infinite alternate;
            filter: brightness(1.4);
        }
        @keyframes invincibleBlink {
            from {
                opacity: 0.7;
            }
            to {
                opacity: 1;
            }
        }
        @keyframes glowPulse {
            from {
                box-shadow: 0 0 30px 10px #fbbf24, 0 0 60px 20px #f59e0b;
            }
            to {
                box-shadow: 0 0 40px 15px #fcd34d, 0 0 80px 30px #fbbf24;
            }
        }
        .rainbow-circle {
            position: absolute;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 5px solid transparent;
            border-top-color: red;
            border-right-color: yellow;
            border-bottom-color: green;
            border-left-color: blue;
            animation: rainbowSpin 0.8s linear infinite;
            pointer-events: none;
            top: -10px;
            left: -10px;
        }
        @keyframes rainbowSpin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }
        .runner-item {
            position: absolute;
            width: 70px;
            height: 70px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            background: #ffffffcc;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            will-change: top;
        }
        .runner-hud {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #ffffffdd;
            backdrop-filter: blur(8px);
            padding: 12px 18px;
            border-radius: 30px;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: #1a2a3a;
            box-shadow: var(--clay-shadow-sm);
            z-index: 20;
        }
        .avatar-btn {
            position: absolute;
            top: 90px;
            left: 20px;
            width: 50px;
            height: 50px;
            border-radius: 25px;
            background: #ffffffdd;
            backdrop-filter: blur(8px);
            border: none;
            font-size: 1.8rem;
            cursor: pointer;
            box-shadow: var(--clay-shadow-sm);
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .runner-controls {
            position: absolute;
            bottom: 120px;
            left: 0;
            right: 0;
            z-index: 20;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            pointer-events: none;
        }
        .runner-ctrl-btn {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            border: none;
            background: #ffffffdd;
            backdrop-filter: blur(6px);
            font-size: 2.5rem;
            cursor: pointer;
            box-shadow: var(--clay-shadow-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            touch-action: manipulation;
        }
        .runner-exit-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #ef4444cc;
            backdrop-filter: blur(6px);
            color: #fff;
            border: none;
            border-radius: 30px;
            padding: 10px 18px;
            font-weight: 900;
            font-family: 'Nunito', sans-serif;
            font-size: 1rem;
            cursor: pointer;
            z-index: 20;
        }
        .gameover-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(6px);
            z-index: 3000;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.25s ease;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .gameover-card {
            background: #fff;
            border-radius: 44px;
            padding: 2rem;
            text-align: center;
            box-shadow: var(--clay-shadow);
            max-width: 340px;
            width: 90%;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn {
            from {
                transform: scale(0.7);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* BOLHAS */
        #bubbleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            z-index: 1000;
            cursor: crosshair;
            overflow: hidden;
            background: linear-gradient(180deg, #0c4a6e 0%, #0369a1 20%, #0284c7 40%, #0ea5e9 60%, #38bdf8 80%, #7dd3fc 100%);
            touch-action: none;
        }
        #bubbleCanvas::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 200%;
            height: 60px;
            background: repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(255,255,255,0.15) 40px, rgba(255,255,255,0.15) 80px);
            animation: waveMove 4s linear infinite;
            border-radius: 50% 50% 0 0;
        }
        @keyframes waveMove {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(-50%);
            }
        }
        .bubble {
            position: absolute;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            box-shadow: inset -8px -8px 16px rgba(0,0,0,0.2), inset 8px 8px 16px rgba(255,255,255,0.5), 0 8px 24px rgba(0,0,0,0.3);
            animation: floatUp linear forwards;
        }
        .bubble::after {
            content: '';
            position: absolute;
            top: 15%;
            left: 22%;
            width: 28%;
            height: 18%;
            background: rgba(255,255,255,0.8);
            border-radius: 50%;
            transform: rotate(-30deg);
        }
        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(0.2);
                opacity: 0;
            }
            8% {
                transform: translateY(-5px) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(-120vh) scale(0.6);
                opacity: 0;
            }
        }
        .bubble-hud {
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 1001;
            pointer-events: none;
        }
        .bubble-hud-item {
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(8px);
            color: #fff;
            padding: 10px 18px;
            border-radius: 50px;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .bubble-exit-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1002;
            background: rgba(239,68,68,0.85);
            color: #fff;
            border: none;
            border-radius: 50px;
            padding: 10px 18px;
            font-weight: 900;
            font-family: 'Nunito', sans-serif;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 0 4px 0 rgba(185,28,28,0.6);
            backdrop-filter: blur(4px);
        }
        .bubble-gameover-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }
        .bubble-gameover-card {
            background: #ffffffdd;
            backdrop-filter: blur(12px);
            border-radius: 44px;
            padding: 2.5rem 2rem;
            text-align: center;
            box-shadow: var(--clay-shadow);
            max-width: 340px;
            width: 90%;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .flash-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1500;
            background: rgba(255,255,255,0.6);
            opacity: 0;
            transition: opacity 0.15s;
        }
    </style>
</head>
<body>
    <input type="file" id="avatarInput" accept="image/*" capture="environment" style="display:none">
    <div class="app-shell" id="appShell">
        <div id="bubbleCanvas"></div>
        <div id="runnerContainer"></div>
        <div class="flash-overlay" id="flashOverlay"></div>
        <!-- MASCOTE INTERATIVO -->
        <div id="mascot" onclick="interactMascot()">🐣</div>
        <div id="homeScreen" class="screen active">
            <div class="title-lg">
                <span class="letter">L</span><span class="letter">I</span><span class="letter">N</span><span class="letter">G</span><span class="letter">O</span>
                <span class="letter">L</span><span class="letter">I</span><span class="letter">N</span><span class="letter">G</span><span class="letter">O</span>
                <span class="title-emoji">🐣</span>
            </div>
            <div class="home-grid">
                <button class="clay-btn" style="background:#3b82f6;" onclick="startNameGame()"><span>👤 NOMES</span></button>
                <button class="clay-btn" style="background:#22c55e;" onclick="startStoryLibrary()"><span>📖 HISTÓRIAS</span></button>
                <button class="clay-btn" style="background:#e11d48;" onclick="startDrawingGame()"><span>🎨 PINTURA</span></button>
                <button class="clay-btn" style="background:#a855f7;" onclick="startVowelCompleteGame()"><span>🔤 COMPLETE A VOGAL</span></button>
                <button class="clay-btn" style="background:#eab308;" onclick="startBuildWordGame()"><span>🧩 MONTA PALAVRA</span></button>
                <button class="clay-btn" style="background:#db2777;" onclick="startRhymeGame()"><span>🎵 QUAL RIMA?</span></button>
                <button class="clay-btn" style="background:#0ea5e9;" onclick="startCountSyllablesGame()"><span>🔢 CONTA SÍLABAS</span></button>
                <button class="clay-btn" style="background:#ef4444;" onclick="startIntruderGame()"><span>🕵️‍♂️ O INTRUSO</span></button>
                <button class="clay-btn span-2" style="background:#6366f1; font-size:1.2rem;" onclick="startBubbleGame()"><span>🫧 BOLHA MÁGICA</span></button>
                <button class="clay-btn span-2" style="background:#f59e0b; font-size:1.2rem;" onclick="startRunnerGame()"><span>🏃 CORRIDA LINGO</span></button>
            </div>
        </div>
        <div id="gameScreen" class="screen">
            <button class="btn-back" onclick="goHome()">🏠 VOLTAR</button>
            <div id="gameContent" style="flex:1; display:flex; flex-direction:column; gap:1rem;"></div>
        </div>
        <div id="storyScreen" class="screen">
            <button class="btn-back" onclick="goHome()">🏠 VOLTAR</button>
            <div id="storyContent" style="flex:1; text-align:center;"></div>
        </div>
        <div id="drawScreen" class="screen"></div>
    </div>

    <script>
        // ==================== UTILITÁRIOS ====================
        // Tutorial e Loading
        const tutorials = {
            drawing: "PINTURA: Escolha uma cor, o tamanho do pincel e comece a desenhar! Você pode desfazer, refazer e até salvar seu desenho!",
            name: "NOME: Clique nos botões com as letras para soletrar seu nome!",
            story: "HISTÓRIAS: Clique em cada palavra para ouvir como se pronuncia. Tem um botão para ler a história inteira!",
            vowel: "VOGAL: Complete as palavras encontrando a vogal que falta!",
            word: "PALAVRA: Monte as palavras usando as letras sorteadas!",
            rhyme: "RIMAS: Escolha qual palavra rima com a palavra mostrada!",
            syllables: "SÍLABAS: Conte quantas sílabas tem cada palavra!",
            intruder: "INTRUSO: Encontre a palavra que não combina com as outras!",
            bubble: "BOLHAS: Estoure as bolhas clicando nelas! Cuidado com as bombas!",
            runner: "CORRIDA: Use os botões nas laterais para desviar dos obstáculos!"
        };
        
        function showLoading() {
            const loader = document.createElement('div');
            loader.id = 'gameLoader';
            loader.style.cssText = `
                position:fixed;top:0;left:0;right:0;bottom:0;
                background:rgba(255,255,255,0.9);
                display:flex;align-items:center;justify-content:center;
                z-index:9999;flex-direction:column;gap:2rem;
            `;
            loader.innerHTML = `
                <div style="font-size:4rem;">🎮</div>
                <div style="font-size:2rem;font-weight:900;color:#1a2a3a;text-align:center;">CARREGANDO JOGO...</div>
                <div style="width:120px;height:8px;background:#e0e0e0;border-radius:10px;overflow:hidden;">
                    <div id="loaderBar" style="width:0%;height:100%;background:linear-gradient(90deg,#6366f1,#ec4899);animation:loading 2s infinite;"></div>
                </div>
            `;
            document.body.appendChild(loader);
        }
        
        function hideLoading() {
            const loader = document.getElementById('gameLoader');
            if (loader) {
                setTimeout(() => loader.remove(), 300);
            }
        }
        
        function showTutorial(gameType) {
            if (localStorage.getItem('tutorial_' + gameType) === 'done') {
                return;

        function speakText(text) {

        function playBeep(f = 660, d = 0.15, type = 'sine') {
            try {
                const c = new(window.AudioContext || window.webkitAudioContext)();
                const o = c.createOscillator();
                const g = c.createGain();
                o.type = type;
                o.frequency.setValueAtTime(f, c.currentTime);
                g.gain.setValueAtTime(0.3, c.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + d);
                o.connect(g);
                g.connect(c.destination);
                o.start(c.currentTime);
                o.stop(c.currentTime + d);
            } catch (e) {}
        }
        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function openStory(index) {
            showScreen('storyScreen');
            const div = document.getElementById('storyContent');
            const s = storyLibrary[index];
            
            // Dividir texto em palavras
            const words = s.text.split(/\s+/);
            
            // Criar HTML com botões para cada palavra
            const wordsHtml = words.map((word, idx) => {
                const clean = word.replace(/[.,!?;:"]/g, '');
                return `<button data-word-idx="${idx}" style="display:inline-block;margin:0.3rem 0.2rem;padding:0.4rem 0.8rem;background:#ec4899;color:#fff;border:none;border-radius:12px;cursor:pointer;font-weight:bold;font-size:0.95rem;box-shadow:0 2px 0 rgba(0,0,0,0.15);transition:all 0.1s;font-family:inherit;text-transform:uppercase;" onmouseover="this.style.backgroundColor='#db2777'" onmouseout="this.style.backgroundColor='#ec4899'" onmousedown="this.style.transform='scale(0.95)'" onmouseup="this.style.transform='scale(1)'" onclick="event.stopPropagation();speakText('${clean}');">${word}</button>`;
            }).join('');
            
            div.innerHTML = `
                <button class="btn-back" onclick="startStoryLibrary()">📚 VOLTAR</button>
                <div class="title-md">${s.icon} ${s.title}</div>
                <button class="clay-btn" style="background:#6366f1;color:#fff;min-height:50px;margin-bottom:1rem;font-size:1.1rem;" id="readFullStoryBtn" onclick="readFullStoryWithHighlight(${index})">🔊 LER HISTÓRIA COMPLETA</button>
                <div style="background:#fef9e7;border-radius:30px;padding:1.8rem;text-align:center;box-shadow:var(--clay-shadow-sm);max-height:50vh;overflow-y:auto;" id="storyWordsContainer">
                    <div style="font-size:1rem;line-height:2;letter-spacing:0.05em;">${wordsHtml}</div>
                </div>
                <div style="font-style:italic;color:#6366f1;margin-top:1rem;font-size:1.4rem;text-align:center;">💡 Moral: ${s.moral}</div>
            `;
        }
        
        function readFullStoryWithHighlight(storyIndex) {
            const s = storyLibrary[storyIndex];
            const words = s.text.split(/\s+/);
            const container = document.getElementById('storyWordsContainer');
            
            // Desabilitar botão durante leitura
            const readBtn = document.getElementById('readFullStoryBtn');
            readBtn.disabled = true;
            readBtn.style.opacity = '0.5';
            
            if ('speechSynthesis' in window) {
                speechSynthesis.cancel();
            }
            
            // Limpar highlight anterior
            const wordButtons = container.querySelectorAll('button');
            wordButtons.forEach(btn => {
                btn.style.background = '#ec4899';
                btn.style.transform = 'scale(1)';
            });
            
            // Ler palavra por palavra com destaque
            let wordIndex = 0;
            
            function readNextWord() {
                if (wordIndex < words.length) {
                    const currentWord = words[wordIndex];
                    const clean = currentWord.replace(/[.,!?;:"]/g, '');
                    
                    // Destacar palavra atual
                    const wordButtons = container.querySelectorAll(`button[data-word-idx="${wordIndex}"]`);
                    if (wordButtons.length > 0) {
                        wordButtons[0].style.background = '#fbbf24';
                        wordButtons[0].style.transform = 'scale(1.1)';
                        
                        // Scroll para palavra visível
                        wordButtons[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                    
                    // Falar palavra
                    if ('speechSynthesis' in window) {
                        const u = new SpeechSynthesisUtterance(clean);
                        u.lang = 'pt-BR';
                        u.rate = 0.9;
                        u.pitch = 1.0;
                        u.volume = 1;
                        
                        u.onend = () => {
                            // Remover destaque
                            if (wordButtons.length > 0) {
                                wordButtons[0].style.background = '#ec4899';
                                wordButtons[0].style.transform = 'scale(1)';
                            }
                            wordIndex++;
                            setTimeout(readNextWord, 200);
                        };
                        
                        speechSynthesis.speak(u);
                    } else {
                        wordIndex++;
                        readNextWord();
                    }
                } else {
                    // Leitura concluída
                    readBtn.disabled = false;
                    readBtn.style.opacity = '1';
                    const wordButtons = container.querySelectorAll('button');
                    wordButtons.forEach(btn => {
                        btn.style.background = '#ec4899';
                        btn.style.transform = 'scale(1)';
                    });
                }
            }
            
            readNextWord();
        }

                        <button id="brushMedium" class="brush-btn" data-size="14" style="width:40px;height:40px;border:2px solid #1a2a3a;background:#fff;border-radius:50%;cursor:pointer;font-size:1.2rem;">🔵</button>

                        <button id="eraserBtn" class="brush-btn" data-mode="eraser" style="width:40px;height:40px;border:2px solid #ef4444;background:#fecaca;border-radius:8px;cursor:pointer;font-weight:900;font-size:0.9rem;">✕</button>
                    </div>

                <div style="display:flex;gap:0.5rem;margin-bottom:0.5rem;justify-content:center;flex-wrap:wrap;">
                    <button id="undoBtn" class="clay-btn-sm" style="background:#3b82f6;color:#fff;flex:1;font-size:0.9rem;">↶ DESFAZER</button>
                    <button id="redoBtn" class="clay-btn-sm" style="background:#6366f1;color:#fff;flex:1;font-size:0.9rem;">↷ REFAZER</button>
                    <button id="clearBtn" class="clay-btn-sm" style="background:#ef4444;color:#fff;flex:1;font-size:0.9rem;">🗑️ LIMPAR</button>

                <canvas id="drawCanvas" style="width:100%;flex:1;background:linear-gradient(135deg,#fef9e7 0%,#fefce8 100%);border-radius:30px;box-shadow:var(--clay-shadow-sm);touch-action:none;cursor:crosshair;border:3px solid #1a2a3a;"></canvas>
                <div style="display:flex;gap:0.5rem;margin-top:0.5rem;justify-content:center;">
                    <button id="saveBtn" class="clay-btn" style="background:#22c55e;color:#fff;flex:1;font-weight:900;font-size:1.1rem;">💾 SALVAR</button>
                </div>
            `;
            
            const canvas = document.getElementById('drawCanvas');
            const ctx = canvas.getContext('2d');
            
            // Configurar canvas em alta resolução
            canvas.width = canvas.offsetWidth * window.devicePixelRatio;
            canvas.height = canvas.offsetHeight * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            
            let brushSize = 6;
            let brushColor = '#e11d48';
            let isEraser = false;
            let isDrawing = false;
            let lastX = 0, lastY = 0;
            
            // História para undo/redo
            let history = [];
            let historyStep = -1;
            
            function saveState() {
                historyStep++;
                if (historyStep < history.length) {
                    history.length = historyStep;
                }
                history.push(canvas.toDataURL());
                if (history.length > 20) history.shift();
                updateUndoRedoButtons();
            }
            
            function updateUndoRedoButtons() {
                document.getElementById('undoBtn').disabled = historyStep <= 0;
                document.getElementById('redoBtn').disabled = historyStep >= history.length - 1;
                document.getElementById('undoBtn').style.opacity = historyStep > 0 ? '1' : '0.5';
                document.getElementById('redoBtn').style.opacity = historyStep < history.length - 1 ? '1' : '0.5';
            }
            
            // Salvar estado inicial
            saveState();
            
            // Cores
            const colors = ['#e11d48','#f97316','#fbbf24','#22c55e','#3b82f6','#8b5cf6','#ec4899','#78716c','#000000','#ffffff'];
            const pal = document.getElementById('colorPalette');
            colors.forEach((col, i) => {
                const sw = document.createElement('button');
                sw.className = 'color-swatch';
                sw.style.width = '36px';
                sw.style.height = '36px';
                sw.style.borderRadius = '50%';
                sw.style.backgroundColor = col;
                sw.style.border = col === '#e11d48' ? '4px solid #1a2a3a' : '2px solid #cbd5e1';
                sw.style.cursor = 'pointer';
                sw.style.boxShadow = 'var(--clay-shadow-sm)';
                sw.style.transition = 'all 0.15s';
                if (col === '#e11d48') sw.classList.add('active');
                sw.addEventListener('click', () => {
                    document.querySelectorAll('.color-swatch').forEach(s => {
                        s.style.border = '2px solid #cbd5e1';
                        s.classList.remove('active');
                    });
                    sw.style.border = '4px solid #1a2a3a';
                    sw.classList.add('active');
                    brushColor = col;
                    isEraser = false;
                    document.getElementById('eraserBtn').style.border = '2px solid #ef4444';
                    playBeep(600, 0.08);
                    navigator.vibrate?.(50);
                });
                pal.appendChild(sw);
            });
            
            // Tamanhos de pincel
            document.getElementById('brushSmall').addEventListener('click', () => {
                brushSize = 6;
                isEraser = false;
                updateBrushButtons();
                playBeep(500, 0.08);
                navigator.vibrate?.(50);
            });
            document.getElementById('brushMedium').addEventListener('click', () => {
                brushSize = 14;
                isEraser = false;
                updateBrushButtons();
                playBeep(700, 0.08);
                navigator.vibrate?.(50);
            });
            document.getElementById('brushLarge').addEventListener('click', () => {
                brushSize = 24;
                isEraser = false;
                updateBrushButtons();
                playBeep(900, 0.08);
                navigator.vibrate?.(50);
            });
            document.getElementById('eraserBtn').addEventListener('click', () => {
                isEraser = true;
                brushSize = 20;
                updateBrushButtons();
                playBeep(400, 0.08);
                navigator.vibrate?.(50);
            });
            
            function updateBrushButtons() {
                document.querySelectorAll('.brush-btn').forEach(b => {
                    b.style.opacity = '0.6';
                });
                if (isEraser) {
                    document.getElementById('eraserBtn').style.opacity = '1';
                    document.getElementById('eraserBtn').style.border = '3px solid #dc2626';
                } else {
                    if (brushSize === 6) document.getElementById('brushSmall').style.opacity = '1';
                    if (brushSize === 14) document.getElementById('brushMedium').style.opacity = '1';
                    if (brushSize === 24) document.getElementById('brushLarge').style.opacity = '1';
                }
            }
            
            // Desenho
            function getPos(e) {
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return {
                    x: (clientX - rect.left) / (rect.width / canvas.offsetWidth),
                    y: (clientY - rect.top) / (rect.height / canvas.offsetHeight)
                };
            }
            
            function startDraw(e) {
                e.preventDefault();
                isDrawing = true;
                const p = getPos(e);
                lastX = p.x;
                lastY = p.y;
            }
            
            function drawOnCanvas(e) {
                if (!isDrawing) return;
                e.preventDefault();
                const p = getPos(e);
                
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.lineWidth = brushSize;
                
                if (isEraser) {
                    ctx.clearRect(p.x - brushSize/2, p.y - brushSize/2, brushSize, brushSize);
                } else {
                    ctx.strokeStyle = brushColor;
                    ctx.beginPath();
                    ctx.moveTo(lastX, lastY);
                    ctx.lineTo(p.x, p.y);
                    ctx.stroke();
                }
                
                lastX = p.x;
                lastY = p.y;
            }
            
            function endDraw() {
                if (!isDrawing) return;
                isDrawing = false;
                saveState();
                spawnParticles(lastX + canvas.offsetLeft, lastY + canvas.offsetTop, brushColor, 3);
            }
            
            canvas.addEventListener('mousedown', startDraw);
            canvas.addEventListener('mousemove', drawOnCanvas);
            canvas.addEventListener('mouseup', endDraw);
            canvas.addEventListener('mouseleave', endDraw);
            canvas.addEventListener('touchstart', startDraw, { passive: false });
            canvas.addEventListener('touchmove', draw, { passive: false });
            canvas.addEventListener('touchend', endDraw);
            
            // Undo/Redo
            document.getElementById('undoBtn').addEventListener('click', () => {
                if (historyStep > 0) {
                    historyStep--;
                    const img = new Image();
                    img.src = history[historyStep];
                    img.onload = () => {
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        ctx.drawImage(img, 0, 0, canvas.offsetWidth, canvas.offsetHeight);
                        updateUndoRedoButtons();
                        playBeep(600, 0.1);
                        navigator.vibrate?.(100);
                    };
                }
            });
            
            document.getElementById('redoBtn').addEventListener('click', () => {
                if (historyStep < history.length - 1) {
                    historyStep++;
                    const img = new Image();
                    img.src = history[historyStep];
                    img.onload = () => {
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        ctx.drawImage(img, 0, 0, canvas.offsetWidth, canvas.offsetHeight);
                        updateUndoRedoButtons();
                        playBeep(600, 0.1);
                        navigator.vibrate?.(100);
                    };
                }
            });
            
            // Limpar
            document.getElementById('clearBtn').addEventListener('click', () => {
                if (confirm('TEM CERTEZA QUE QUER LIMPAR O DESENHO?')) {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    historyStep = -1;
                    history = [];
                    saveState();
                    playBeep(800, 0.2);
                    launchConfetti(10);
                    navigator.vibrate?.([100, 50, 100]);
                }
            });
            
            // Salvar
            document.getElementById('saveBtn').addEventListener('click', () => {
                const link = document.createElement('a');
                link.href = canvas.toDataURL('image/png');
                link.download = 'meu-desenho-' + Date.now() + '.png';
                link.click();
                speakText('Desenho salvo com sucesso!');
                playBeep(1000, 0.15);
                launchConfetti(25);
                navigator.vibrate?.([50, 100, 50]);
            });
            
            speakText('Bem-vindo ao jogo de pintura! Use as cores, pincéis e a borracha para criar sua obra-prima!');
        }

                document.getElementById('bubbleRetry').addEventListener('click', () => { overlay.remove(); hud.remove(); canvas.style.display = 'none'; canvas.innerHTML = ''; startBubbleGame(); });
                document.getElementById('bubbleHome').addEventListener('click', () => { overlay.remove(); hud.remove(); goHome(); });
                speakText(message + ' Você fez ' + points + ' pontos!');
            }

            const types = [
                { w: 70, pts: 1, emoji: ['🫧','💧','✨','🌟','💎','🪩','🔮','💠','🌀','🌊','🫐','🍬','🧿','💙'], colors: ['#38bdf8','#818cf8','#34d399','#fbbf24','#f472b6','#a78bfa','#fb923c','#4ade80'], size: [40,70], speed: [6,12] },
                { w: 12, pts: 5, emoji: ['⭐','👑','🏆','💛','🌟'], colors: ['#fbbf24','#f59e0b','#fcd34d'], size: [50,80], speed: [4,8] },
                { w: 10, pts: 3, emoji: ['❤️','🌈','🎉','🦋','🌸','🍭','🎀'], colors: ['#f472b6','#ec4899','#fbcfe8','#c084fc'], size: [55,85], speed: [5,10] },
                { w: 5, pts: -1, emoji: ['💣','💥','🧨','🔥'], colors: ['#ef4444','#dc2626','#b91c1c'], size: [45,65], speed: [8,14], isBomb: true },
                { w: 3, pts: 50, emoji: ['🌈','🦄','🎠'], colors: ['linear-gradient(45deg,red,yellow,green,blue,purple)'], size: [60,90], speed: [7,11], isRainbow: true },
            ];
            function rndType() { const total = types.reduce((s,t) => s + t.w, 0); let r = Math.random() * total; for (const t of types) { r -= t.w; if (r <= 0) return t; } return types[0]; }
            const safe = { top: 70, left: 30, right: 30, bottom: 100 };
            function create() {
                if (!alive || canvas.style.display !== 'block') return;
                const t = rndType(); const em = t.emoji[Math.floor(Math.random() * t.emoji.length)]; const col = t.colors[Math.floor(Math.random() * t.colors.length)]; const sz = Math.random() * (t.size[1] - t.size[0]) + t.size[0]; const sp = Math.random() * (t.speed[1] - t.speed[0]) + t.speed[0]; const maxLeft = Math.max(window.innerWidth - safe.right - sz, safe.left); const b = document.createElement('div'); b.className = 'bubble'; b.style.width = sz + 'px'; b.style.height = sz + 'px'; b.style.left = (Math.random() * (maxLeft - safe.left) + safe.left) + 'px'; b.style.bottom = '-10px'; b.style.background = col.startsWith('linear') ? col : `radial-gradient(circle at 30% 30%, rgba(255,255,255,0.9), ${col} 60%, ${col}dd 100%)`; b.textContent = em; b.style.animationDuration = sp + 's'; canvas.appendChild(b); b.addEventListener('animationend', () => b.remove()); b.addEventListener('click', (e) => { if (!alive || b.dataset.popped) return; b.dataset.popped = '1'; if (t.isBomb) { playBeep(80, 0.6, 'square'); flash.style.opacity = '1'; setTimeout(() => flash.style.opacity = '0', 200); b.remove(); showBubbleGameOver('💣 VOCÊ EXPLODIU UMA BOMBA!'); return; } const pts = t.pts; points = pts > 0 ? points + pts : Math.max(0, points + pts); scoreEl.textContent = points; if (t.isRainbow) { flash.style.opacity = '1'; setTimeout(() => flash.style.opacity = '0', 150); playBeep(1200, 0.15); setTimeout(() => playBeep(1500, 0.1), 100); launchConfetti(20); } else { playBeep(600 + pts * 50, 0.1); } spawnParticles(e.clientX, e.clientY, col, 8); b.remove(); }); }
            window._bubbleInterval = setInterval(create, 500);
            const exitBtn = document.createElement('button'); exitBtn.className = 'bubble-exit-btn'; exitBtn.textContent = '🔚 SAIR'; exitBtn.onclick = () => { alive = false; clearInterval(window._bubbleInterval); canvas.style.display = 'none'; canvas.innerHTML = ''; hud.remove(); exitBtn.remove(); speakText('Jogo encerrado! Você fez ' + points + ' pontos!'); goHome(); }; document.body.appendChild(exitBtn);
            speakText('Estoure as bolhas! Cuidado com as bombas!');
        }

        function startRunnerGame() {
            const container = document.getElementById('runnerContainer');
            if (window._runnerInterval) clearInterval(window._runnerInterval);
            if (window._runnerLoop) cancelAnimationFrame(window._runnerLoop);
            if (window._musicCtx) { window._musicCtx.stop(); window._musicCtx = null; }
            if (window._keyHandler) window.removeEventListener('keydown', window._keyHandler);
            document.querySelectorAll('.gameover-overlay').forEach(e => e.remove());
            container.innerHTML = '';
            container.style.display = 'block';
            if (!window.avatarSrc) window.avatarSrc = '🐱';
            let invincible = false; let invincibleTimer = null;
            const lanes = [window.innerWidth * 0.2 - 35, window.innerWidth / 2 - 35, window.innerWidth * 0.8 - 35];
            let currentLane = 1; let score = 0; let alive = true; const items = []; const MAX_ITEMS = 12;
            const player = document.createElement('div'); player.className = 'runner-player'; player.style.bottom = '220px'; updatePlayerAppearance(); container.appendChild(player);
            function updatePlayerAppearance() { player.innerHTML = ''; if (window.avatarSrc && window.avatarSrc !== '🐱' && window.avatarSrc !== '') { const img = document.createElement('img'); img.src = window.avatarSrc; img.style.width = '100%'; img.style.height = '100%'; img.style.objectFit = 'cover'; player.appendChild(img); } else { player.textContent = window.avatarSrc || '🐱'; } }
            function updatePlayerPosition() { player.style.left = lanes[currentLane] + 'px'; } updatePlayerPosition();
            const hud = document.createElement('div'); hud.className = 'runner-hud'; hud.innerHTML = `⭐ <span id="runnerScore">0</span>`; container.appendChild(hud); const scoreEl = document.getElementById('runnerScore');
            const avatarBtn = document.createElement('button'); avatarBtn.className = 'avatar-btn'; avatarBtn.textContent = '📷'; avatarBtn.addEventListener('click', () => document.getElementById('avatarInput').click()); container.appendChild(avatarBtn);
            document.getElementById('avatarInput').addEventListener('change', (e) => { const file = e.target.files[0]; if (file) { const reader = new FileReader(); reader.onload = (ev) => { window.avatarSrc = ev.target.result; updatePlayerAppearance(); speakText('Avatar atualizado!'); }; reader.readAsDataURL(file); } });
            const controls = document.createElement('div'); controls.className = 'runner-controls'; controls.style.bottom = '150px'; controls.innerHTML = `<button class="runner-ctrl-btn" id="btnLeft">⬅️</button><button class="runner-ctrl-btn" id="btnRight">➡️</button>`; container.appendChild(controls);
            function moveLeft() { if (currentLane > 0 && alive) { currentLane--; updatePlayerPosition(); playBeep(400, 0.05); } }
            function moveRight() { if (currentLane < 2 && alive) { currentLane++; updatePlayerPosition(); playBeep(400, 0.05); } }
            const btnLeft = document.getElementById('btnLeft'); const btnRight = document.getElementById('btnRight'); btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); moveLeft(); }); btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); moveRight(); }); btnLeft.addEventListener('mousedown', moveLeft); btnRight.addEventListener('mousedown', moveRight);
            window._keyHandler = (e) => { if (e.key === 'ArrowLeft') moveLeft(); if (e.key === 'ArrowRight') moveRight(); }; window.addEventListener('keydown', window._keyHandler);
            const exitBtn = document.createElement('button'); exitBtn.className = 'runner-exit-btn'; exitBtn.textContent = '🔚 SAIR'; exitBtn.onclick = () => { alive = false; if (window._runnerInterval) clearInterval(window._runnerInterval); if (window._runnerLoop) cancelAnimationFrame(window._runnerLoop); if (invincibleTimer) clearTimeout(invincibleTimer); if (window._musicCtx) { window._musicCtx.stop(); window._musicCtx = null; } if (window._keyHandler) window.removeEventListener('keydown', window._keyHandler); document.querySelectorAll('.gameover-overlay').forEach(e => e.remove()); container.style.display = 'none'; container.innerHTML = ''; speakText('Corrida encerrada! Você fez ' + score + ' pontos!'); goHome(); }; container.appendChild(exitBtn);
            function startMusic() { if (window._musicCtx) return; try { const ctx = new(window.AudioContext || window.webkitAudioContext)(); const notes = [262, 294, 330, 349, 392, 349, 330, 294]; let noteIndex = 0; function playNote() { if (!alive || !window._musicCtx) return; const o = ctx.createOscillator(); const g = ctx.createGain(); o.type = 'triangle'; o.frequency.setValueAtTime(notes[noteIndex % notes.length], ctx.currentTime); g.gain.setValueAtTime(0.02, ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4); o.connect(g); g.connect(ctx.destination); o.start(ctx.currentTime); o.stop(ctx.currentTime + 0.4); noteIndex++; window._musicTimeout = setTimeout(playNote, 500); } playNote(); window._musicCtx = { ctx, stop: () => { ctx.close(); window._musicCtx = null; clearTimeout(window._musicTimeout); } }; } catch (e) {} }
            btnLeft.addEventListener('touchstart', startMusic, { once: true }); btnRight.addEventListener('touchstart', startMusic, { once: true }); btnLeft.addEventListener('mousedown', startMusic, { once: true }); btnRight.addEventListener('mousedown', startMusic, { once: true });
            function playStarSound() { playBeep(800, 0.08); setTimeout(() => playBeep(1000, 0.08), 80); }
            function playCrashSound() { playBeep(100, 0.4, 'square'); }
            function playFruitSound() { playBeep(600, 0.1); setTimeout(() => playBeep(900, 0.12), 100); }
            function addRainbowCircle() { const existing = player.querySelector('.rainbow-circle'); if (existing) return; const circle = document.createElement('div'); circle.className = 'rainbow-circle'; player.appendChild(circle); }
            function removeRainbowCircle() { const circle = player.querySelector('.rainbow-circle'); if (circle) circle.remove(); }
            function activateFruitPower() { addRainbowCircle(); player.classList.add('invincible'); if (invincible) { if (invincibleTimer) clearTimeout(invincibleTimer); } else { invincible = true; speakText('Poder da fruta!'); } invincibleTimer = setTimeout(() => { invincible = false; player.classList.remove('invincible'); removeRainbowCircle(); invincibleTimer = null; }, 5000); }
            let lastSpawn = 0;
            function spawnItem(timestamp) { if (!alive || items.length >= MAX_ITEMS || timestamp - lastSpawn < 650) return; lastSpawn = timestamp; const rand = Math.random(); let type, emoji; if (rand < 0.6) { type = 'coin'; emoji = '⭐'; } else if (rand < 0.92) { type = 'rock'; emoji = Math.random() < 0.5 ? '🌳' : '🪨'; } else { type = 'fruit'; emoji = ['🍎','🍌','🍇'][Math.floor(Math.random()*3)]; } const item = document.createElement('div'); item.className = 'runner-item'; item.textContent = emoji; item.dataset.type = type; const laneIdx = Math.floor(Math.random() * 3); item.dataset.lane = laneIdx; item.style.left = lanes[laneIdx] + 'px'; item.style.top = '-80px'; container.appendChild(item); items.push(item); }
            function showGameOver(finalScore) { const overlay = document.createElement('div'); overlay.className = 'gameover-overlay'; overlay.innerHTML = `<div class="gameover-card"><div style="font-size:5rem;">😅</div><div style="font-family:Fredoka;font-size:2rem;font-weight:700;color:#1a2a3a;">VOCÊ BATEU!</div><div style="font-size:1.6rem;color:#f59e0b;font-weight:700;">⭐ ${finalScore} PONTOS</div><button class="gameover-btn" id="gameoverRetry" style="background:#6366f1;color:#fff;border:none;font-family:Nunito;font-weight:900;font-size:1.1rem;padding:0.9rem 1.8rem;border-radius:32px;cursor:pointer;width:100%;">🔄 TENTAR DE NOVO</button></div>`; document.body.appendChild(overlay); document.getElementById('gameoverRetry').addEventListener('click', () => { overlay.remove(); items.forEach(o => o.remove()); items.length = 0; score = 0; scoreEl.textContent = '0'; alive = true; currentLane = 1; updatePlayerPosition(); if (invincibleTimer) clearTimeout(invincibleTimer); invincible = false; player.classList.remove('invincible'); removeRainbowCircle(); lastSpawn = performance.now(); startMusic(); }); }
            function gameLoop(timestamp) { if (!alive) { window._runnerLoop = requestAnimationFrame(gameLoop); return; } spawnItem(timestamp); const playerRect = player.getBoundingClientRect(); const px = playerRect.left + playerRect.width / 2, py = playerRect.top + playerRect.height / 2; for (let i = items.length - 1; i >= 0; i--) { const item = items[i]; const top = parseFloat(item.style.top) || -80; item.style.top = (top + 6) + 'px'; const ir = item.getBoundingClientRect(); const ix = ir.left + ir.width / 2, iy = ir.top + ir.height / 2; const dx = px - ix, dy = py - iy; const dist = Math.sqrt(dx*dx+dy*dy); const collided = dist < 50 && parseInt(item.dataset.lane) === currentLane && top > window.innerHeight - 320; if (collided) { item.remove(); items.splice(i, 1); if (item.dataset.type === 'coin') { score += 10; scoreEl.textContent = score; playStarSound(); spawnParticles(px, py, '#fbbf24', 5); } else if (item.dataset.type === 'fruit') { activateFruitPower(); playFruitSound(); spawnParticles(px, py, '#ec4899', 10); } else if (item.dataset.type === 'rock') { if (invincible) { score += 5; scoreEl.textContent = score; playBeep(500, 0.1); spawnParticles(px, py, '#fbbf24', 3); } else { alive = false; document.body.style.transform = 'translate(8px,8px)'; setTimeout(() => document.body.style.transform = '', 100); playCrashSound(); if (invincibleTimer) clearTimeout(invincibleTimer); invincible = false; player.classList.remove('invincible'); removeRainbowCircle(); if (window._musicCtx) { window._musicCtx.stop(); window._musicCtx = null; } showGameOver(score); break; } } } else if (top > window.innerHeight + 50) { item.remove(); items.splice(i, 1); } } window._runnerLoop = requestAnimationFrame(gameLoop); }
            window._runnerLoop = requestAnimationFrame(gameLoop);
            speakText('Corra! Use as setas nas laterais para desviar!');
        }

        // ==================== INICIALIZAÇÃO (MANTIDA) ====================
        Object.assign(window, { startNameGame, startStoryLibrary, startDrawingGame, startVowelCompleteGame, startBuildWordGame, startRhymeGame, startCountSyllablesGame, startIntruderGame, startBubbleGame, startRunnerGame, goHome, clearCanvas: window.clearCanvas, speakText, launchConfetti });
        console.log('🐣 LINGO LINGO CRIANÇAS — ULTIMATE com Mascote, Partículas, Modo Noturno e Double Buffer!');
    </script>
