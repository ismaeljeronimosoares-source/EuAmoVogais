<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
    <title>Lingo Lingo Crianças — Leitura Divertida</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at 10% 30%, #b8f2e6, #9ed9cf);
            font-family: 'Montserrat', 'Fredoka', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            animation: bgPulse 8s infinite alternate;
        }

        @keyframes bgPulse {
            0% { background: radial-gradient(circle at 10% 30%, #b8f2e6, #9ed9cf); }
            100% { background: radial-gradient(circle at 90% 70%, #c0f5e8, #8fcfc2); }
        }

        /* App container com efeito vidro e animação de entrada */
        .app-container {
            max-width: 1300px;
            width: 100%;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(2px);
            border-radius: 64px;
            box-shadow: 0 30px 50px -20px rgba(0, 0, 0, 0.3), inset 0 1px 2px rgba(255,255,255,0.7);
            overflow: hidden;
            animation: slideUpScale 0.5s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        @keyframes slideUpScale {
            from { opacity: 0; transform: scale(0.96) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* Telas internas */
        .screen {
            display: none;
            padding: 1.8rem 2rem 2rem;
            animation: fadeUp 0.4s ease-out;
        }

        .screen.active {
            display: flex;
            flex-direction: column;
            height: auto;
            min-height: 82vh;
            max-height: 90vh;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Tipografia */
        h1, h2, .title-big {
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .gradient-text {
            background: linear-gradient(120deg, #1A8F82, #2EC4B6);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            animation: textShine 3s infinite;
        }

        @keyframes textShine {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Cards e botões com hover e animações */
        .glass-card {
            background: white;
            border-radius: 48px;
            box-shadow: 0 12px 28px -8px rgba(0, 0, 0, 0.12);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-modern {
            border: none;
            border-radius: 60px;
            font-weight: 700;
            font-family: 'Montserrat', sans-serif;
            cursor: pointer;
            transition: 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            background: white;
            color: #1F2A44;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.05);
        }

        .btn-modern:hover {
            transform: translateY(-4px) scale(1.02);
        }

        .btn-modern:active {
            transform: scale(0.96);
        }

        .btn-primary { background: linear-gradient(105deg, #FF9F1C, #FFBF69); color: white; box-shadow: 0 8px 18px -6px #FF9F1C; }
        .btn-secondary { background: linear-gradient(105deg, #4EA8DE, #6CC3F0); color: white; }
        .btn-story { background: linear-gradient(105deg, #7209B7, #9D4EDD); color: white; }

        /* GRADE DE HISTÓRIAS */
        .story-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.4rem;
            margin: 1.5rem 0;
            overflow-y: auto;
            max-height: 58vh;
            padding-right: 6px;
        }

        .story-card {
            background: #FFFEF7;
            border-radius: 40px;
            padding: 1rem 0.5rem;
            text-align: center;
            transition: all 0.25s ease;
            cursor: pointer;
            border: 1px solid rgba(0,0,0,0.04);
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.05);
            animation: cardFloat 3s infinite ease-in-out;
        }

        @keyframes cardFloat {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
            100% { transform: translateY(0px); }
        }

        .story-card:hover {
            transform: translateY(-10px) scale(1.02);
            background: #FFF3E0;
            box-shadow: 0 20px 30px -12px rgba(0,0,0,0.2);
        }

        .story-emoji {
            font-size: 3.8rem;
            display: block;
            transition: transform 0.2s;
        }

        .story-card:hover .story-emoji {
            transform: scale(1.1) rotate(5deg);
        }

        .story-title {
            font-weight: 800;
            color: #1E2A3E;
            font-size: 1.1rem;
            text-transform: uppercase;
            margin-top: 0.4rem;
        }

        /* JOGO - SEM ROLAGEM + animações */
        .game-layout {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex: 1;
            overflow: hidden;
            height: 100%;
        }

        .quiz-card {
            background: white;
            border-radius: 52px;
            padding: 1.2rem;
            margin: 0.6rem 0;
            text-align: center;
            flex-shrink: 0;
            animation: softGlow 2s infinite alternate;
        }

        @keyframes softGlow {
            0% { box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
            100% { box-shadow: 0 15px 30px rgba(46,196,182,0.2); }
        }

        .image-box {
            font-size: 5rem;
            width: 120px;
            height: 120px;
            background: #FFF0D4;
            border-radius: 50px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.6rem;
            box-shadow: inset 0 -3px 0 #F4A261;
            transition: transform 0.2s;
        }

        .image-box.pop {
            animation: bouncePop 0.4s cubic-bezier(0.34, 1.2, 0.64, 1);
        }

        @keyframes bouncePop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2) rotate(4deg); }
            100% { transform: scale(1); }
        }

        .word-display {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: 6px;
            background: #F3F6FB;
            padding: 0.3rem 1rem;
            border-radius: 60px;
            display: inline-block;
            margin: 0.5rem 0;
        }

        .vowel-card {
            font-size: 4rem;
            font-weight: 800;
            width: 120px;
            height: 120px;
            background: #EDF2F7;
            border-radius: 48px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin: 0.3rem auto;
            transition: 0.2s;
        }

        .vowel-card.correct {
            animation: correctBounce 0.5s ease-out;
            background: #2EC4B6;
            color: white;
            transform: scale(1.1);
        }

        .vowel-card.wrong {
            animation: shake 0.3s ease-in-out;
            background: #E71D36;
            color: white;
        }

        @keyframes correctBounce {
            0% { transform: scale(1); }
            50% { transform: scale(1.3) rotate(5deg); }
            100% { transform: scale(1.1); }
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
            100% { transform: translateX(0); }
        }

        .choices {
            display: flex;
            gap: 0.8rem;
            justify-content: center;
            flex-wrap: wrap;
            margin: 0.8rem 0;
        }

        .choice-letter {
            width: 70px;
            height: 70px;
            font-size: 2.4rem;
            font-weight: 800;
            background: #FF7096;
            color: white;
            border-radius: 35px;
            box-shadow: 0 6px 0 #B91145;
            transition: 0.05s linear;
        }

        .choice-letter.correct {
            background: #2EC4B6 !important;
            box-shadow: 0 6px 0 #1C8B7A !important;
            animation: correctPulse 0.4s;
        }

        .choice-letter.wrong {
            background: #E71D36 !important;
            box-shadow: 0 6px 0 #9E1428 !important;
            animation: shake 0.3s;
        }

        @keyframes correctPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        /* Barra superior */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.8rem;
            flex-shrink: 0;
        }

        .back-button {
            background: #EFF3F6;
            border: none;
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .back-button:hover {
            background: #e0e6ec;
            transform: scale(1.02);
        }

        /* LEITURA - FONTE DOBRADA (3rem) e animações */
        .story-reader {
            background: #FEFAF0;
            border-radius: 48px;
            padding: 1.6rem;
            margin-top: 0.8rem;
            overflow-y: auto;
            flex: 1;
            animation: fadeSlide 0.5s ease;
        }

        @keyframes fadeSlide {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .story-paragraph {
            font-size: 3rem;
            line-height: 3.8rem;
            margin-bottom: 1.8rem;
            font-weight: 600;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            text-transform: uppercase;
        }

        .story-word {
            cursor: pointer;
            padding: 0 6px;
            border-radius: 18px;
            transition: 0.1s linear;
            text-transform: uppercase;
        }

        .story-word:active {
            background: #D4E6E0;
            transform: scale(0.96);
        }

        .story-word-active {
            background: #2EC4B6 !important;
            color: white !important;
            transform: scale(1.05);
            animation: wordPop 0.2s ease-out;
        }

        @keyframes wordPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1.05); }
        }

        .story-hint {
            text-align: center;
            font-size: 0.85rem;
            margin-top: 0.8rem;
            color: #6A7B8E;
        }

        /* Estrelas animadas */
        .star-counter {
            transition: all 0.2s;
        }
        .star-counter:active {
            transform: scale(1.1);
        }

        @media (max-width: 700px) {
            .screen { padding: 1rem; }
            .quiz-card { padding: 0.9rem; }
            .image-box { width: 95px; height: 95px; font-size: 3.8rem; }
            .word-display { font-size: 1.6rem; letter-spacing: 3px; }
            .vowel-card { width: 90px; height: 90px; font-size: 3rem; }
            .choice-letter { width: 58px; height: 58px; font-size: 1.9rem; }
            .story-paragraph { font-size: 2rem; line-height: 2.6rem; }
            .story-grid { max-height: 55vh; }
        }
    </style>
</head>
<body>
<div id="root">
    <div class="app-container">
        <!-- TELA INICIAL -->
        <div id="homeScreen" class="screen active">
            <div style="text-align: center; margin-bottom: 0.5rem;">
                <span style="font-size: 5rem; animation: bouncePop 2s infinite;">🎒✨</span>
                <h1 class="gradient-text" style="font-size: 3rem; margin: 0.2rem 0;">LINGO LINGO</h1>
                <p style="color: #2F4858; font-weight: 500;">LEIA, OUÇA E APRENDA BRINCANDO!</p>
            </div>
            <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 1.2rem; margin: 1.2rem 0;">
                <button class="btn-modern btn-primary" style="padding: 1rem 1.8rem; min-width: 190px;" onclick="startGame('geral')">
                    <span style="font-size: 2.2rem;">🧸</span><br>PALAVRAS GERAIS
                </button>
                <button class="btn-modern btn-secondary" style="padding: 1rem 1.8rem; min-width: 190px;" onclick="startGame('nomes')">
                    <span style="font-size: 2.2rem;">👤</span><br>NOMES PRÓPRIOS
                </button>
                <button class="btn-modern btn-story" style="padding: 1rem 1.8rem; min-width: 190px;" onclick="openStoryMenu()">
                    <span style="font-size: 2.2rem;">📖🌟</span><br>BIBLIOTECA
                </button>
            </div>
            <button class="back-button" style="margin: 0 auto; width: fit-content;" onclick="location.reload()">
                🗑️ LIMPAR MEMÓRIA
            </button>
        </div>

        <!-- TELA DO JOGO -->
        <div id="gameScreen" class="screen">
            <div class="game-layout">
                <div class="top-bar">
                    <div class="badge-phase" id="phaseBadge" style="background:#1FA195; padding:0.3rem 1rem; border-radius:40px; color:white;">FASE 1 / 0</div>
                    <div class="star-counter" id="starCounter" style="background:#FFF3BF; padding:0.2rem 1rem; border-radius:40px;">⭐ 0</div>
                </div>
                <div class="quiz-card">
                    <div id="imageBox" class="image-box">🧸</div>
                    <div id="wordDisplay" class="word-display"></div>
                    <div id="vowelFocus" class="vowel-card">?</div>
                    <div id="choicesContainer" class="choices"></div>
                </div>
                <div style="display: flex; justify-content: center; gap: 1rem; margin: 0.8rem 0 0.2rem;">
                    <button id="btnNext" class="btn-modern btn-story" style="padding: 0.6rem 1.8rem; display:none;" onclick="nextQuestion()">➡️ PRÓXIMO</button>
                    <button id="btnRestart" class="btn-modern btn-primary" style="padding: 0.6rem 1.8rem; display:none;" onclick="goHome()">🏠 JOGAR NOVAMENTE</button>
                </div>
                <button class="back-button" style="margin: 0.4rem auto; width: fit-content;" onclick="goHome()">⬅ VOLTAR</button>
            </div>
        </div>

        <!-- MENU DE HISTÓRIAS -->
        <div id="storyMenu" class="screen">
            <div class="top-bar">
                <div><span style="font-size: 2.2rem;">📚</span><h2 style="display: inline-block; margin-left: 10px;">ESCOLHA UMA HISTÓRIA</h2></div>
                <button class="back-button" onclick="goHome()">VOLTAR</button>
            </div>
            <div class="story-grid" id="storyList"></div>
        </div>

        <!-- TELA DE LEITURA -->
        <div id="storyScreen" class="screen">
            <div class="top-bar">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <span id="storyEmoji" style="font-size: 2.4rem;">🦢</span>
                    <h2 id="storyTitleDisplay" style="font-size: 1.8rem; text-transform: uppercase;">O PATINHO FEIO</h2>
                </div>
                <button class="back-button" onclick="openStoryMenu()">⬅ VOLTAR</button>
            </div>
            <div class="story-reader" id="storyBody"></div>
            <div class="story-hint">🔊 TOQUE EM QUALQUER PALAVRA PARA OUVIR | 🔊 TOQUE NO ALTO-FALANTE PARA OUVIR A FRASE</div>
        </div>
    </div>
</div>

    // Variáveis globais
    let currentPool = [], order = [], gameIndex = 0, stars = 0, answered = false, currentStory = null;
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    // Funções de áudio e utilidades
    function speak(text, slow = false) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text.toLowerCase());
        u.lang = 'pt-BR';
        u.rate = slow ? 0.75 : 0.9;
        u.pitch = 1.2;
        window.speechSynthesis.speak(u);
    }

    function playCorrectSound() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        [[523.25, 0], [659.25, 0.12]].forEach(([f, d]) => {
            const o = audioCtx.createOscillator(), g = audioCtx.createGain();
            o.type = 'triangle';
            o.frequency.value = f;
            g.gain.setValueAtTime(0, audioCtx.currentTime + d);
            g.gain.linearRampToValueAtTime(0.15, audioCtx.currentTime + d + 0.05);
            g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + d + 0.3);
            o.connect(g); g.connect(audioCtx.destination);
            o.start(audioCtx.currentTime + d);
            o.stop(audioCtx.currentTime + d + 0.4);
        });
    }

    function playWrongSound() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        [[220, 0], [196, 0.15]].forEach(([f, d]) => {
            const o = audioCtx.createOscillator(), g = audioCtx.createGain();
            o.type = 'sawtooth';
            o.frequency.value = f;
            g.gain.setValueAtTime(0, audioCtx.currentTime + d);
            g.gain.linearRampToValueAtTime(0.1, audioCtx.currentTime + d + 0.04);
            g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + d + 0.3);
            o.connect(g); g.connect(audioCtx.destination);
            o.start(audioCtx.currentTime + d);
            o.stop(audioCtx.currentTime + d + 0.32);
        });
    }

    function shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function goHome() {
        window.speechSynthesis.cancel();
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('homeScreen').classList.add('active');
    }

    function startGame(cat) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        currentPool = cat === 'nomes' ? nomesWords : geralWords;
        order = shuffle([...Array(currentPool.length).keys()]);
        gameIndex = 0;
        stars = 0;
        answered = false;
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('gameScreen').classList.add('active');
        loadQuestion();
    }

    function loadQuestion() {
        answered = false;
        const item = currentPool[order[gameIndex]];
        document.getElementById('phaseBadge').innerText = `FASE ${gameIndex + 1} / ${currentPool.length}`;
        document.getElementById('starCounter').innerHTML = `⭐ ${stars}`;
        document.getElementById('imageBox').innerText = item.emoji || '👤';
        document.getElementById('imageBox').classList.add('pop');
        setTimeout(() => document.getElementById('imageBox').classList.remove('pop'), 300);
        document.getElementById('vowelFocus').innerText = '?';
        document.getElementById('vowelFocus').className = 'vowel-card';
        document.getElementById('btnNext').style.display = 'none';
        document.getElementById('btnRestart').style.display = 'none';

        const disp = document.getElementById('wordDisplay');
        disp.innerHTML = '';
        item.palavra.split('').forEach((ch, i) => {
            const sp = document.createElement('span');
            sp.style.margin = '0 3px';
            if (ch === ' ') {
                sp.style.width = '12px';
                sp.style.display = 'inline-block';
            } else if (i === item.pos) {
                sp.innerText = '_';
                sp.id = 'targetVowel';
            } else {
                sp.innerText = ch;
            }
            disp.appendChild(sp);
        });

        const cont = document.getElementById('choicesContainer');
        cont.innerHTML = '';
        ['A', 'E', 'I', 'O', 'U'].forEach(v => {
            const btn = document.createElement('button');
            btn.className = 'choice-letter btn-modern';
            btn.innerText = v;
            btn.onclick = () => checkAnswer(v);
            cont.appendChild(btn);
        });
    }

    function checkAnswer(sel) {
        if (answered) return;
        answered = true;
        const item = currentPool[order[gameIndex]];
        const isCorrect = sel === item.vogal;
        const focus = document.getElementById('vowelFocus');
        focus.innerText = item.vogal;
        focus.classList.add(isCorrect ? 'correct' : 'wrong');

        if (isCorrect) {
            stars++;
            document.getElementById('starCounter').innerHTML = `⭐ ${stars}`;
            const t = document.getElementById('targetVowel');
            if (t) {
                t.innerText = item.vogal;
                t.style.color = '#1FA195';
                t.style.fontWeight = 'bold';
            }
            playCorrectSound();
        } else {
            playWrongSound();
        }

        document.querySelectorAll('.choice-letter').forEach(btn => {
            btn.disabled = true;
            if (btn.innerText === item.vogal) btn.classList.add('correct');
            else if (btn.innerText === sel && !isCorrect) btn.classList.add('wrong');
        });

        speak(item.fala || item.palavra);

        if (gameIndex < currentPool.length - 1) {
            document.getElementById('btnNext').style.display = 'block';
        } else {
            setTimeout(() => {
                focus.innerText = '🏆';
                focus.classList.add('correct');
                document.getElementById('btnRestart').style.display = 'block';
            }, 1000);
        }
    }

    function nextQuestion() {
        gameIndex++;
        loadQuestion();
    }

    function openStoryMenu() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('storyMenu').classList.add('active');
        const grid = document.getElementById('storyList');
        grid.innerHTML = '';
        stories.forEach((s, i) => {
            const card = document.createElement('div');
            card.className = 'story-card';
            card.innerHTML = `<div class="story-emoji">${s.emoji}</div><div class="story-title">${s.title}</div>`;
            card.onclick = () => openSelectedStory(i);
            grid.appendChild(card);
        });
    }

    function openSelectedStory(idx) {
        currentStory = stories[idx];
        document.getElementById('storyTitleDisplay').innerText = currentStory.title;
        document.getElementById('storyEmoji').innerText = currentStory.emoji;
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('storyScreen').classList.add('active');
        renderStory();
    }

    function renderStory() {
        const body = document.getElementById('storyBody');
        body.innerHTML = '';
        if (!currentStory) return;
        currentStory.paragraphs.forEach(text => {
            const p = document.createElement('p');
            p.className = 'story-paragraph';
            const speaker = document.createElement('button');
            speaker.innerText = '🔊';
            speaker.style.background = 'none';
            speaker.style.border = 'none';
            speaker.style.fontSize = '1.3rem';
            speaker.style.cursor = 'pointer';
            speaker.style.marginRight = '10px';
            speaker.onclick = () => speak(text);
            p.appendChild(speaker);
            const tokens = text.split(/(\s+)/);
            tokens.forEach(token => {
                if (/^\s+$/.test(token)) {
                    p.appendChild(document.createTextNode(' '));
                } else {
                    const span = document.createElement('span');
                    span.className = 'story-word';
                    span.innerText = token;
                    span.onclick = () => {
                        const clean = token.replace(/[.,!?;:""''()]/g, '').trim();
                        if (clean) speak(clean, true);
                        span.classList.add('story-word-active');
                        setTimeout(() => span.classList.remove('story-word-active'), 300);
                    };
                    p.appendChild(span);
                }
            });
            body.appendChild(p);
        });
    }
</script>
