<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
    <title>Lingo Lingo Crianças</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * { 
  margin: 0; 
  padding: 0; 
  box-sizing: border-box; 
  user-select: none; 
  -webkit-user-select: none; 
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
}

html, body, #root {
  height: 100%;
  width: 100%;
}

body {
  background: linear-gradient(135deg, #a8ff78, #78ffd6);
  font-family: 'Montserrat', Arial, sans-serif;
  text-transform: uppercase;
  height: 100vh;
  height: 100dvh;
  width: 100vw;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 10px;
  overflow: hidden;
}

.app-container {
  width: 100%;
  max-width: 1100px;
  height: 100%;
  max-height: 90vh;
  max-height: 90dvh;
  background: linear-gradient(180deg, #ffffff, #f7fff7);
  border-radius: 30px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.15);
  display: flex;
  flex-direction: row;
  overflow: hidden;
  border: 4px solid rgba(255, 255, 255, 0.8);
  position: relative;
}

#homeScreen {
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 20px;
  background: linear-gradient(135deg, #fffdf6, #f4fff8);
  z-index: 10;
}

.main-title {
  font-family: 'Fredoka', 'Montserrat', Arial, sans-serif;
  color: #1fa195;
  font-size: 3.2rem;
  margin-bottom: 10px;
  font-weight: 700;
  letter-spacing: 1px;
  text-shadow: 3px 4px 0px rgba(31, 161, 149, 0.18);
}

.category-container {
  display: flex;
  gap: 20px;
  margin-top: 25px;
  flex-wrap: wrap;
  justify-content: center;
}

.btn-category {
  border: none;
  padding: 20px 30px;
  border-radius: 24px;
  font-size: 1.3rem;
  font-weight: bold;
  color: white;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  width: 240px;
  cursor: pointer;
  font-family: 'Montserrat', Arial, sans-serif;
  text-transform: uppercase;
}
.bg-geral { background: #ff9f1c; box-shadow: 0 8px 0 #cc7a00; }
.bg-nomes { background: #4ea8de; box-shadow: 0 8px 0 #3a7ca5; }
.bg-historia { background: #7209b7; box-shadow: 0 8px 0 #4d0080; }

.main-game {
  display: none;
  flex-direction: column;
  justify-content: space-between;
  padding: 20px;
  flex: 1;
  height: 100%;
  overflow: hidden;
}

.game-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
}

.badge-phase {
  background: #1fa195;
  color: white;
  padding: 6px 16px;
  border-radius: 50px;
  font-weight: bold;
  font-size: 1rem;
  box-shadow: 0 4px 0 #157269;
}

.star-counter {
  font-size: 1.1rem;
  font-weight: bold;
  color: #ffb703;
  background: #fff;
  padding: 4px 14px;
  border-radius: 50px;
  border: 2px solid #ffb703;
}

.quiz-area {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  flex-grow: 1; 
  min-height: 0;
  position: relative;
}

.image-box {
  font-size: 5.5rem;
  width: 130px;
  height: 130px;
  background: #ffd166;
  border-radius: 35px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 6px 0 #f4a261;
  margin-bottom: 15px;
  flex-shrink: 0;
}

.image-box.pop { animation: popEffect 0.3s ease-in-out; }

.word-display {
  font-size: 3.5rem;
  font-weight: bold;
  letter-spacing: 12px;
  color: #2b2d42;
  margin-bottom: 10px;
  text-align: center;
  white-space: nowrap; 
  display: flex;
  justify-content: center;
  align-items: center;
  flex-shrink: 0;
}

.highlight-letter {
  color: #1fa195;
  font-weight: 900;
  text-decoration: underline;
  text-underline-offset: 6px;
}

.center-feedback-vowel {
  font-size: 6rem;
  font-weight: 900;
  color: #ccc;
  min-height: 120px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s ease;
  width: 120px;
  height: 120px;
  border-radius: 25px;
  background: #f7fff7;
  margin-top: 5px;
  border: 3px dashed #ddd;
  position: relative;
}
.center-feedback-vowel.correct {
  color: white;
  background: #2ec4b6;
  border: 3px solid #1fa195;
  box-shadow: 0 10px 25px rgba(46, 196, 182, 0.4);
  transform: scale(1.1);
}
.center-feedback-vowel.wrong {
  color: white;
  background: #e71d36;
  border: 3px solid #b91125;
  box-shadow: 0 10px 25px rgba(231, 29, 54, 0.4);
  transform: scale(1.1);
}

.trophy-end {
  font-size: 8rem;
  animation: trophyAnimation 2s infinite ease-in-out;
  width: 150px;
  height: 150px;
  min-height: 150px;
}

.choices-container {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 12px;
  width: 100%;
  flex-shrink: 0;
}

.choice-btn {
  background: #ff7096;
  color: white;
  border: none;
  border-radius: 18px;
  font-size: 2.5rem;
  font-weight: bold;
  padding: 10px 0;
  box-shadow: 0 6px 0 #ff477e;
  cursor: pointer;
  font-family: 'Montserrat', Arial, sans-serif;
  text-transform: uppercase;
}
.choice-btn:disabled { cursor: default; }
.choice-btn.correct { background: #2ec4b6 !important; box-shadow: 0 6px 0 #1fa195 !important; }
.choice-btn.wrong { background: #e71d36 !important; box-shadow: 0 6px 0 #b91125 !important; }

.navigation-area {
  width: 100%;
  display: flex;
  justify-content: center;
  margin-top: 15px;
  flex-shrink: 0;
}

.btn-next {
  background: #7209b7;
  color: white;
  font-size: 2rem;
  padding: 12px 0;
  border-radius: 50px;
  border: none;
  font-weight: bold;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 15px;
  width: 100%;
  animation: strongPulse 1.2s infinite;
  cursor: pointer;
  font-family: 'Montserrat', Arial, sans-serif;
  text-transform: uppercase;
}

.sidebar {
  background: linear-gradient(180deg, #f0f7f4, #eef1f6);
  flex-direction: column;
  padding: 20px;
  justify-content: flex-start;
  align-items: center;
  width: 260px;
  height: 100%;
  border-left: 2px solid rgba(0,0,0,0.05);
  gap: 30px;
}

.btn-back-small {
  background: #6c757d;
  color: white;
  border: none;
  box-shadow: 0 3px 0 #495057;
  padding: 8px 16px;
  font-size: 0.85rem;
  border-radius: 12px;
  font-weight: bold;
  width: auto;
  min-width: 100px;
  text-align: center;
  cursor: pointer;
  font-family: 'Montserrat', Arial, sans-serif;
  text-transform: uppercase;
}

.sidebar-decor {
  font-size: 4rem;
  margin-top: auto;
  margin-bottom: auto;
  opacity: 0.7;
}

.btn-red { 
  background: #e71d36; 
  color: white; 
  border: none;
  box-shadow: 0 5px 0 #a11224; 
  padding: 12px 24px; 
  font-size: 1rem; 
  border-radius: 20px;
  font-weight: bold;
  width: 100%;
  margin-top: 25px;
  flex-shrink: 0;
  cursor: pointer;
  font-family: 'Montserrat', Arial, sans-serif;
  text-transform: uppercase;
}

@media (max-width: 768px) {
  .app-container { flex-direction: column; max-height: 100%; height: 100%; border-radius: 20px; }
  .main-game { padding: 12px; }
  
  #homeScreen { padding: 15px; }
  .main-title { font-size: 1.8rem; margin-bottom: 5px; }
  #homeScreen p { font-size: 0.8rem !important; margin-bottom: 5px !important; }
  .category-container { margin-top: 10px; gap: 8px; }
  .btn-category { width: 145px; padding: 10px 8px; font-size: 0.85rem; border-radius: 16px; box-shadow: 0 4px 0 #333; gap: 4px; }
  .btn-category span { font-size: 1.4rem !important; }
  .bg-geral { box-shadow: 0 4px 0 #cc7a00; }
  .bg-nomes { box-shadow: 0 4px 0 #3a7ca5; }
  
  .btn-red { margin-top: 15px; padding: 8px 12px; font-size: 0.8rem; max-width: 150px !important; box-shadow: 0 3px 0 #a11224; border-radius: 12px; }

  .sidebar { 
    display: flex !important;
    flex-direction: row !important; 
    padding: 6px 12px; 
    background: #f0f7f4; 
    height: auto; 
    width: 100%;
    justify-content: space-between; 
    align-items: center;
    border-left: none;
    border-top: 2px solid rgba(0,0,0,0.05);
  }
  .sidebar-decor { display: none; }
  .center-feedback-vowel { font-size: 3.5rem; width: 75px; height: 75px; min-height: 75px; border-radius: 16px; }
  .trophy-end { font-size: 4.5rem; width: 100px; height: 100px; min-height: 100px; }
  .image-box { font-size: 3.5rem; width: 85px; height: 85px; margin-bottom: 5px; }
  .word-display { font-size: 1.8rem; letter-spacing: 4px; min-height: 35px; }
  .choices-container { gap: 6px; }
  .choice-btn { font-size: 1.5rem; padding: 6px 0; border-radius: 10px; box-shadow: 0 4px 0 #ff477e; }
  .btn-next { font-size: 1.3rem; padding: 8px 0; }
  .btn-back-small { padding: 4px 10px; font-size: 0.75rem; min-width: 70px; box-shadow: 0 2px 0 #495057; }
}

@keyframes popEffect {
  0% { transform: scale(1); }
  50% { transform: scale(1.1) rotate(3deg); }
  100% { transform: scale(1); }
}

@keyframes strongPulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.02); }
  100% { transform: scale(1); }
}

@keyframes trophyAnimation {
  0% { transform: scale(1) rotate(0deg); }
  25% { transform: scale(1.1) rotate(5deg); }
  50% { transform: scale(1) rotate(0deg); }
  75% { transform: scale(1.1) rotate(-5deg); }
  100% { transform: scale(1) rotate(0deg); }
}

.firework {
  position: absolute;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  opacity: 0;
  pointer-events: none;
}

@keyframes explode {
  0% { transform: translate(0, 0); opacity: 1; }
  100% { transform: translate(var(--x), var(--y)); opacity: 0; }
}

/* ── STORY SCREEN ─────────────────────────────────────── */

.story-screen {
  display: flex;
  flex-direction: column;
  flex: 1;
  height: 100%;
  overflow: hidden;
  padding: 20px 24px;
  gap: 12px;
}

.story-header {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-shrink: 0;
}

.story-title-emoji {
  font-size: 3.5rem;
  line-height: 1;
}

.story-label {
  font-size: 0.75rem;
  font-weight: 700;
  color: #7209b7;
  letter-spacing: 2px;
  margin-bottom: 2px;
}

.story-title {
  font-size: 1.8rem;
  font-weight: 900;
  color: #2b2d42;
  line-height: 1.1;
}

.story-hint {
  font-size: 0.72rem;
  font-weight: 600;
  color: #888;
  background: #f0f7f4;
  border-radius: 12px;
  padding: 8px 14px;
  text-transform: none;
  flex-shrink: 0;
  letter-spacing: 0;
}

.story-body {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 18px;
  padding-right: 6px;
  padding-bottom: 12px;
}

.story-body::-webkit-scrollbar {
  width: 6px;
}
.story-body::-webkit-scrollbar-track {
  background: transparent;
}
.story-body::-webkit-scrollbar-thumb {
  background: #c0e0d8;
  border-radius: 10px;
}

.story-paragraph {
  font-size: 2.7rem;
  font-weight: 600;
  color: #2b2d42;
  line-height: 2.2;
  text-transform: uppercase;
  letter-spacing: 0;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0;
}

.story-speaker {
  background: none;
  border: none;
  font-size: 1.1rem;
  cursor: pointer;
  padding: 2px 6px 2px 0;
  margin-right: 4px;
  opacity: 0.6;
  transition: opacity 0.15s, transform 0.15s;
  flex-shrink: 0;
  font-family: inherit;
}

.story-speaker:hover {
  opacity: 1;
  transform: scale(1.2);
}

.story-word {
  display: inline-block;
  cursor: pointer;
  padding: 2px 5px;
  border-radius: 8px;
  transition: background 0.15s, color 0.15s, transform 0.12s;
  user-select: none;
  -webkit-user-select: none;
}

.story-word:hover {
  background: #e0f7f4;
  color: #1fa195;
}

.story-word:active {
  transform: scale(0.94);
}

.story-word-active {
  background: #2ec4b6 !important;
  color: white !important;
  transform: scale(1.08) !important;
  box-shadow: 0 4px 12px rgba(46, 196, 182, 0.4);
}

@media (max-width: 768px) {
  .story-screen { padding: 12px 14px; gap: 8px; }
  .story-title-emoji { font-size: 2.5rem; }
  .story-title { font-size: 1.3rem; }
  .story-label { font-size: 0.65rem; }
  .story-hint { font-size: 0.65rem; padding: 6px 10px; }
  .story-paragraph { font-size: 2.3rem; line-height: 2.1; gap: 0; }
  .story-body { gap: 14px; }
}

        /* Ajustes para versão standalone */
        .main-game { display: none; }
        #root { height: 100%; width: 100%; }
    </style>
</head>
<body>
    <div id="root">
        <div class="app-container">
            <!-- HOME SCREEN -->
            <div id="homeScreen">
                <div style="font-size: 5rem; margin-bottom: 15px; display: flex; gap: 15px;">🎒 📚</div>
                <h1 class="main-title">Lingo Lingo Crianças</h1>
                <p style="color: #555; margin-bottom: 10px; max-width: 500px; font-size: 1.1rem; font-weight: bold;">
                    ESCOLHA UMA ATIVIDADE:
                </p>
                <div class="category-container">
                    <button class="btn-category bg-geral" onclick="startGame('geral')">
                        <span style="font-size: 2.5rem;">🧸</span>
                        PALAVRAS GERAIS
                    </button>
                    <button class="btn-category bg-nomes" onclick="startGame('nomes')">
                        <span style="font-size: 2.5rem;">👤</span>
                        NOMES DE PESSOAS
                    </button>
                    <button class="btn-category bg-historia" onclick="openStory()">
                        <span style="font-size: 2.5rem;">🦢</span>
                        LEITURA
                    </button>
                </div>
                <button class="btn-red" style="max-width: 200px;" onclick="location.reload()">
                    🗑️ LIMPAR MEMÓRIA
                </button>
            </div>

            <!-- GAME SCREEN -->
            <div id="gameScreen" class="main-game">
                <div class="game-header">
                    <div id="phaseBadge" class="badge-phase">FASE 1 / 0</div>
                    <div id="starCounter" class="star-counter">⭐ 0</div>
                </div>

                <div class="quiz-area" id="quizArea">
                    <div id="imageBox" class="image-box pop">🧸</div>
                    <div id="wordDisplay" class="word-display"></div>
                    <div id="vowelFocus" class="center-feedback-vowel">?</div>
                </div>

                <div id="choicesContainer" class="choices-container">
                    <!-- Botões gerados via JS -->
                </div>

                <div class="navigation-area">
                    <button id="btnNext" class="btn-next" style="display:none;" onclick="nextQuestion()">
                        PRÓXIMO ➔
                    </button>
                    <button id="btnRestart" class="btn-next" style="display:none;" onclick="goHome()">
                        🏠 JOGAR NOVAMENTE
                    </button>
                </div>
                
                <div class="sidebar" style="display: flex;">
                    <button class="btn-back-small" onclick="goHome()">⬅ VOLTAR</button>
                    <div class="sidebar-decor">✏️</div>
                </div>
            </div>

            <!-- STORY SCREEN -->
            <div id="storyScreen" class="story-screen" style="display:none;">
                <div class="story-header">
                    <div class="story-title-emoji">🦢</div>
                    <div>
                        <div class="story-label">HISTÓRIA PARA LEITURA</div>
                        <h2 class="story-title">O PATINHO FEIO</h2>
                    </div>
                </div>
                <div class="story-hint">
                    Toque em qualquer palavra para ouvi-la. Toque em 🔊 para ouvir a frase toda.
                </div>
                <div id="storyBody" class="story-body">
                    <!-- Parágrafos gerados via JS -->
                </div>
                <div class="sidebar" style="display: flex;">
                    <button class="btn-back-small" onclick="goHome()">⬅ VOLTAR</button>
                    <div class="sidebar-decor">🦢</div>
                </div>
            </div>
        </div>
    </div>

        const nomesWords = [{'emoji': '', 'palavra': 'BEATRIZ', 'vogal': 'E', 'pos': 1, 'fala': ''}, {'emoji': '', 'palavra': 'CAMILA', 'vogal': 'I', 'pos': 3, 'fala': ''}, {'emoji': '', 'palavra': 'MANUELA', 'vogal': 'U', 'pos': 3, 'fala': ''}, {'emoji': '', 'palavra': 'ELLEN', 'vogal': 'E', 'pos': 0, 'fala': 'Élen'}, {'emoji': '', 'palavra': 'LAVÍNIA', 'vogal': 'I', 'pos': 3, 'fala': 'Lavínia'}, {'emoji': '', 'palavra': 'ANA PAULA', 'vogal': 'A', 'pos': 2, 'fala': ''}, {'emoji': '', 'palavra': 'LANINHA', 'vogal': 'A', 'pos': 1, 'fala': ''}, {'emoji': '', 'palavra': 'VÍTOR', 'vogal': 'I', 'pos': 1, 'fala': 'Vítor'}, {'emoji': '', 'palavra': 'LARISSA', 'vogal': 'I', 'pos': 3, 'fala': ''}, {'emoji': '', 'palavra': 'LUCAS', 'vogal': 'A', 'pos': 3, 'fala': ''}, {'emoji': '', 'palavra': 'LIDIANE', 'vogal': 'I', 'pos': 1, 'fala': ''}, {'emoji': '', 'palavra': 'PEDRO', 'vogal': 'E', 'pos': 1, 'fala': ''}, {'emoji': '', 'palavra': 'MARCELLE', 'vogal': 'E', 'pos': 4, 'fala': 'Marcéle'}, {'emoji': '', 'palavra': 'LAYSA', 'vogal': 'A', 'pos': 1, 'fala': 'Laíza'}, {'emoji': '', 'palavra': 'GABRIEL', 'vogal': 'A', 'pos': 1, 'fala': ''}];
        const story = {'title': 'O Patinho Feio', 'emoji': '🦢', 'paragraphs': ['Era uma vez uma mamãe pata 🦆 que chocou seus ovos 🥚 com muito carinho. ❤️', 'Um dia os ovos abriram 🥚✨ e saíram muitos patinhos lindos e amarelos. 🐥', 'Mas um patinho era bem diferente dos outros. 🤨 Ele era grande e cinza. 🌫️', 'Os outros patos riam muito dele 🤭 e diziam: Que patinho feio! 😟', 'O patinho ficou muito triste 😢 e foi embora para um lago distante. 🏞️', 'No inverno fazia muito frio ❄️ e o patinho sofreu bastante sozinho. 🥶', 'Mas a primavera chegou 🌸 e tudo ficou bonito de novo. ☀️', 'O patinho olhou para a água 💧 e viu sua própria imagem. 😮', 'Ele não era mais um patinho feio! Era um belo cisne branco! 🦢✨', 'Os outros cisnes o receberam com alegria e amor. 🥰', 'E o patinho viveu feliz para sempre. 🎉🏰']};

        let currentPool = [];
        let order = [];
        let gameIndex = 0;
        let stars = 0;
        let answered = false;
        let gameOver = false;
        let activeWord = null;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playCorrectSound() {
            const ctx = audioCtx;
            if (ctx.state === 'suspended') ctx.resume();
            [[523.25, 0], [659.25, 0.12], [783.99, 0.24]].forEach(([freq, delay]) => {
                const osc = ctx.createOscillator();
                const g = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.value = freq;
                g.gain.setValueAtTime(0, ctx.currentTime + delay);
                g.gain.linearRampToValueAtTime(0.2, ctx.currentTime + delay + 0.05);
                g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + 0.3);
                osc.connect(g); g.connect(ctx.destination);
                osc.start(ctx.currentTime + delay);
                osc.stop(ctx.currentTime + delay + 0.4);
            });
        }

        function playWrongSound() {
            const ctx = audioCtx;
            if (ctx.state === 'suspended') ctx.resume();
            [[220, 0], [196, 0.15]].forEach(([freq, delay]) => {
                const osc = ctx.createOscillator();
                const g = ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.value = freq;
                g.gain.setValueAtTime(0, ctx.currentTime + delay);
                g.gain.linearRampToValueAtTime(0.1, ctx.currentTime + delay + 0.04);
                g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + 0.3);
                osc.connect(g); g.connect(ctx.destination);
                osc.start(ctx.currentTime + delay);
                osc.stop(ctx.currentTime + delay + 0.32);
            });
        }

        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function speak(text, slow = false) {
            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            const utter = new SpeechSynthesisUtterance(text.toLowerCase());
            utter.lang = 'pt-BR';
            utter.rate = slow ? 0.75 : 0.9;
            utter.pitch = 1.3;
            window.speechSynthesis.speak(utter);
        }

        function startGame(category) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            currentPool = category === 'nomes' ? nomesWords : geralWords;
            order = shuffle([...Array(currentPool.length).keys()]);
            gameIndex = 0;
            stars = 0;
            gameOver = false;
            document.getElementById('homeScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'flex';
            document.getElementById('storyScreen').style.display = 'none';
            loadQuestion();
        }

        function openStory() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            document.getElementById('homeScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'none';
            document.getElementById('storyScreen').style.display = 'flex';
            renderStory();
        }

        function goHome() {
            window.speechSynthesis.cancel();
            document.getElementById('homeScreen').style.display = 'flex';
            document.getElementById('gameScreen').style.display = 'none';
            document.getElementById('storyScreen').style.display = 'none';
            document.getElementById('btnRestart').style.display = 'none';
        }

        function loadQuestion() {
            answered = false;
            const item = currentPool[order[gameIndex]];
            document.getElementById('phaseBadge').innerText = `FASE ${gameIndex + 1} / ${currentPool.length}`;
            document.getElementById('starCounter').innerText = `⭐ ${stars}`;
            document.getElementById('imageBox').innerText = item.emoji || '👤';
            document.getElementById('vowelFocus').innerText = '?';
            document.getElementById('vowelFocus').className = 'center-feedback-vowel';
            document.getElementById('btnNext').style.display = 'none';
            
            // Render Word
            const display = document.getElementById('wordDisplay');
            display.innerHTML = '';
            item.palavra.split('').forEach((char, i) => {
                const span = document.createElement('span');
                span.style.margin = '0 4px';
                if (char === ' ') {
                    span.style.width = '20px';
                    span.style.display = 'inline-block';
                } else if (i === item.pos) {
                    span.innerText = '_';
                    span.id = 'targetVowel';
                } else {
                    span.innerText = char;
                }
                display.appendChild(span);
            });

            // Render Choices
            const choices = document.getElementById('choicesContainer');
            choices.innerHTML = '';
            ['A', 'E', 'I', 'O', 'U'].forEach(v => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.innerText = v;
                btn.onclick = () => checkAnswer(v);
                choices.appendChild(btn);
            });
        }

        function checkAnswer(selected) {
            if (answered) return;
            answered = true;
            const item = currentPool[order[gameIndex]];
            const isCorrect = selected === item.vogal;
            
            const focus = document.getElementById('vowelFocus');
            focus.innerText = item.vogal;
            focus.className = 'center-feedback-vowel ' + (isCorrect ? 'correct' : 'wrong');
            
            if (isCorrect) {
                stars++;
                document.getElementById('starCounter').innerText = `⭐ ${stars}`;
                document.getElementById('targetVowel').innerText = item.vogal;
                document.getElementById('targetVowel').className = 'highlight-letter';
                playCorrectSound();
            } else {
                playWrongSound();
            }

            // Feedback visual nos botões
            const buttons = document.querySelectorAll('.choice-btn');
            buttons.forEach(btn => {
                btn.disabled = true;
                if (btn.innerText === item.vogal) btn.classList.add('correct');
                else if (btn.innerText === selected && !isCorrect) btn.classList.add('wrong');
            });

            speak(item.fala || item.palavra);
            
            if (gameIndex < currentPool.length - 1) {
                document.getElementById('btnNext').style.display = 'block';
            } else {
                gameOver = true;
                setTimeout(() => {
                    focus.innerText = '🏆';
                    focus.className = 'center-feedback-vowel correct trophy-end';
                    document.getElementById('btnRestart').style.display = 'block';
                }, 1000);
            }
        }

        function nextQuestion() {
            gameIndex++;
            loadQuestion();
        }

        function renderStory() {
            const body = document.getElementById('storyBody');
            body.innerHTML = '';
            story.paragraphs.forEach((text, pIdx) => {
                const p = document.createElement('p');
                p.className = 'story-paragraph';
                
                const speaker = document.createElement('button');
                speaker.className = 'story-speaker';
                speaker.innerText = '🔊';
                speaker.onclick = () => speak(text);
                p.appendChild(speaker);

                const tokens = text.split(/(\s+)/);
                tokens.forEach(token => {
                    if (/^\s+$/.test(token)) {
                        p.appendChild(document.createTextNode(' '));
                    } else {
                        const span = document.createElement('span');
                        span.className = 'story-word';
                        span.innerText = token;
                        span.onclick = () => {
                            const clean = token.replace(/[.,!?;:""''()]/g, '').trim();
                            speak(clean, true);
                            span.classList.add('story-word-active');
                            setTimeout(() => span.classList.remove('story-word-active'), 500);
                        };
                        p.appendChild(span);
                    }
                });
                body.appendChild(p);
            });
        }
