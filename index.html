<!DOCTYPE html>
<html lang="pt-BR">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        .logo { text-align: center; margin-bottom: 0.5rem; }

        .logo-sub { font-family: 'Fredoka', sans-serif; font-size: 1.8rem; font-weight: 700; background: linear-gradient(135deg, #FF9F1C, #FFB347); background-clip: text; -webkit-background-clip: text; color: transparent; display: block; letter-spacing: 2px; animation: wiggleEmoji 2s infinite; }
        @keyframes bounceText { 0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);} }
        .btn-modern { border: none; border-radius: 100px; font-weight: 700; font-family: 'Montserrat', sans-serif; cursor: pointer; transition: 0.2s; background: white; color: #1F2A44; box-shadow: 0 6px 14px rgba(0,0,0,0.08); }
        .btn-modern:active { transform: scale(0.96); }
        .btn-primary { background: linear-gradient(105deg, #FFB347, #FF9F1C); color: white; }
        .btn-secondary { background: linear-gradient(105deg, #6CC3F0, #4EA8DE); color: white; }
        .btn-story { background: linear-gradient(105deg, #9D4EDD, #7209B7); color: white; }
        .btn-cartoon { background: linear-gradient(105deg, #FF6B6B, #EE5A24); color: white; }
        .story-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px,1fr)); gap: 1.2rem; margin: 1.5rem 0; overflow-y: auto; max-height: 58vh; padding-right: 6px; }
        .story-card { background: white; border-radius: 48px; padding: 1rem 0.5rem; text-align: center; cursor: pointer; transition: 0.25s; border: 1px solid rgba(0,0,0,0.04); box-shadow: 0 10px 20px -8px rgba(0,0,0,0.1); animation: floatCard 3s infinite ease-in-out; }
        @keyframes floatCard { 0%{transform:translateY(0px);}50%{transform:translateY(-6px);}100%{transform:translateY(0px);} }
        .story-card:hover { transform: translateY(-8px) scale(1.02); background: #FFF8E7; }
        .story-emoji { font-size: 3.5rem; display: block; animation: wiggleEmoji 2s infinite; }
        @keyframes wiggleEmoji { 0%,100%{transform:rotate(0deg);}25%{transform:rotate(3deg);}75%{transform:rotate(-3deg);} }
        .story-title { font-weight: 800; color: #1E2A3E; font-size: 1rem; text-transform: uppercase; margin-top: 0.4rem; }
        .quiz-card { background: white; border-radius: 56px; padding: 1.2rem; margin: 0.8rem 0; text-align: center; box-shadow: 0 15px 30px -10px rgba(0,0,0,0.1); }
        .image-box { font-size: 5rem; width: 120px; height: 120px; background: #FFF0D4; border-radius: 60px; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 0.6rem; box-shadow: inset 0 -3px 0 #F4A261; animation: softBob 3s infinite ease; }
        @keyframes softBob { 0%,100%{transform:translateY(0px);}50%{transform:translateY(-5px);} }
        .image-box.pop { animation: bouncePop 0.4s cubic-bezier(0.34,1.2,0.64,1); }
        @keyframes bouncePop { 0%{transform:scale(1);}50%{transform:scale(1.2) rotate(5deg);}100%{transform:scale(1);} }
        .word-display { font-size: 2.4rem; font-weight: 800; letter-spacing: 5px; background: #F0F4FA; padding: 0.2rem 1rem; border-radius: 60px; display: inline-block; margin: 0.5rem 0; }
        .vowel-card { font-size: 3.8rem; font-weight: 800; width: 110px; height: 110px; background: #EDF2F7; border-radius: 55px; display: inline-flex; align-items: center; justify-content: center; margin: 0.3rem auto; transition: 0.2s; }
        .vowel-card.correct { animation: correctBounce 0.5s ease-out; background: #31C9B8; color: white; transform: scale(1.1); }
        .vowel-card.wrong { animation: shake 0.3s ease-in-out; background: #FF5A5F; color: white; }
        @keyframes correctBounce { 0%{transform:scale(1);}50%{transform:scale(1.3) rotate(4deg);}100%{transform:scale(1.1);} }
        @keyframes shake { 0%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}100%{transform:translateX(0);} }
        .choices { display: flex; gap: 0.8rem; justify-content: center; flex-wrap: wrap; margin: 0.8rem 0; }
        .choice-letter { width: 70px; height: 70px; font-size: 2.4rem; font-weight: 800; background: #FF9F6E; color: white; border-radius: 35px; box-shadow: 0 6px 0 #CC6F3E; transition: 0.05s; animation: floatLetter 2s infinite; }
        @keyframes floatLetter { 0%,100%{transform:translateY(0);}50%{transform:translateY(-3px);} }
        .choice-letter.correct { background: #31C9B8 !important; box-shadow: 0 6px 0 #1F8A7C !important; animation: correctPulse 0.4s; }
        .choice-letter.wrong { background: #FF5A5F !important; box-shadow: 0 6px 0 #C73C41 !important; animation: shake 0.3s; }
        @keyframes correctPulse { 0%{transform:scale(1);}50%{transform:scale(1.15);}100%{transform:scale(1);} }
        .star-counter { background: #FFE8B6; border-radius: 40px; padding: 0.2rem 0.8rem; font-weight: bold; font-size: 1.2rem; display: inline-flex; align-items: center; gap: 5px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); animation: starSpin 0.5s ease-out; }
        @keyframes starSpin { from { transform: rotate(0deg) scale(1); } to { transform: rotate(360deg) scale(1.2); } }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; flex-wrap: wrap; }
        .badge-phase { background: #31C9B8; padding: 0.3rem 1rem; border-radius: 40px; color: white; font-weight: bold; }
        .back-button { background: #E2E8F0; border: none; padding: 0.4rem 1.2rem; border-radius: 40px; font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: 0.2s; }
        .back-button:hover { background: #CBD5E1; transform: scale(1.02); }
        .story-reader { background: #FFFDF5; border-radius: 48px; padding: 1.5rem; margin-top: 0.8rem; overflow-y: auto; flex: 1; }
        .story-paragraph { font-size: 3rem; line-height: 3.6rem; margin-bottom: 1.5rem; font-weight: 600; display: flex; flex-wrap: wrap; align-items: center; text-transform: uppercase; }
        .story-word { cursor: pointer; padding: 0 4px; border-radius: 16px; transition: 0.1s; text-transform: uppercase; display: inline-block; animation: gentleWordWobble 3s infinite ease-in-out; }
        @keyframes gentleWordWobble { 0%,100%{transform:translateY(0px) rotate(0deg);}50%{transform:translateY(-2px) rotate(0.5deg);} }
        .story-word:active { background: #D4E6E0; transform: scale(0.96); }
        .story-word-active { background: #31C9B8 !important; color: white !important; transform: scale(1.05); animation: wordPop 0.2s; }
        @keyframes wordPop { 0%{transform:scale(1);}50%{transform:scale(1.1);}100%{transform:scale(1.05);} }
        .cartoon-screen { background: linear-gradient(145deg, #FFF2E0, #FFE0B5); border-radius: 64px; padding: 1.5rem; text-align: center; display: flex; flex-direction: column; flex: 1; justify-content: center; align-items: center; gap: 1rem; }
        .cartoon-emoji { font-size: 10rem; display: inline-block; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.2)); margin-bottom: 0.5rem; animation: cartoonBounce 0.8s infinite alternate ease-in-out; }
        /* Animação de subida para o ratinho */
        @keyframes climbing { 0% { transform: translateY(0px); } 50% { transform: translateY(-25px); } 100% { transform: translateY(0px); } }
        .climbing-mouse { animation: climbing 0.6s ease-in-out 2; }
        @keyframes cartoonBounce { from { transform: translateY(0px) scale(1); } to { transform: translateY(-15px) scale(1.05); } }
        .cartoon-text { font-size: 2.2rem; font-weight: 800; color: #2C3E50; background: rgba(255,255,240,0.9); padding: 0.8rem 1.5rem; border-radius: 60px; display: inline-block; max-width: 90%; text-transform: uppercase; animation: fadeInText 0.5s; }
        @keyframes fadeInText { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        .cartoon-progress { font-size: 1.2rem; font-weight: bold; color: #4A6A7F; background: white; padding: 0.3rem 1rem; border-radius: 50px; margin-top: 0.5rem; }
        .cartoon-hint { font-size: 0.9rem; color: #BB6B3A; background: #FFE8D6; padding: 0.4rem 1rem; border-radius: 30px; }
        .btn-next-scene { background: #EE5A24; color: white; border: none; border-radius: 60px; padding: 0.8rem 2rem; font-size: 1.2rem; font-weight: bold; margin-top: 0.5rem; cursor: pointer; }

        @media (max-width: 700px) { .screen { padding: 1rem; } .logo-main { font-size: 2.4rem; } .logo-sub { font-size: 1.2rem; } .cartoon-emoji { font-size: 6rem; } .cartoon-text { font-size: 1.4rem; } .last-scene-emoji { font-size: 3.5rem !important; } }

</head>

<div id="root">
    <div class="app-container">
        <!-- HOME -->
        <div id="homeScreen" class="screen active">

                <button class="btn-modern btn-primary" style="padding: 0.9rem 1.5rem; min-width: 180px;" onclick="startGame('geral')"><span style="font-size: 2rem;">🧸</span><br>PALAVRAS GERAIS</button>
                <button class="btn-modern btn-secondary" style="padding: 0.9rem 1.5rem; min-width: 180px;" onclick="startGame('nomes')"><span style="font-size: 2rem;">👤</span><br>NOMES PRÓPRIOS</button>
                <button class="btn-modern btn-story" style="padding: 0.9rem 1.5rem; min-width: 180px;" onclick="openStoryMenu()"><span style="font-size: 2rem;">📖🌟</span><br>BIBLIOTECA</button>
                <button class="btn-modern btn-cartoon" style="padding: 0.9rem 1.5rem; min-width: 180px;" onclick="openCartoon()"><span style="font-size: 2rem;">🎬🐱</span><br>DESENHO ANIMADO</button>
            </div>
            <button class="back-button" style="margin: 0 auto; width: fit-content;" onclick="location.reload()">🗑️ LIMPAR MEMÓRIA</button>
        </div>

        <!-- GAME -->
        <div id="gameScreen" class="screen">
            <div class="top-bar"><div class="badge-phase" id="phaseBadge">FASE 1 / 0</div><div class="star-counter" id="starCounter">⭐ 0</div></div>
            <div class="quiz-card"><div id="imageBox" class="image-box">🧸</div><div id="wordDisplay" class="word-display"></div><div id="vowelFocus" class="vowel-card">?</div><div id="choicesContainer" class="choices"></div></div>
            <div style="display: flex; justify-content: center; gap: 0.8rem; margin: 0.5rem 0;"><button id="btnNext" class="btn-modern btn-story" style="padding: 0.5rem 1.5rem; display:none;" onclick="nextQuestion()">➡️ PRÓXIMO</button><button id="btnRestart" class="btn-modern btn-primary" style="padding: 0.5rem 1.5rem; display:none;" onclick="goHome()">🏠 JOGAR NOVAMENTE</button></div>
            <button class="back-button" style="margin-top: 0.5rem; align-self: center;" onclick="goHome()">⬅ VOLTAR</button>
        </div>

        <!-- MENU HISTÓRIAS -->
        <div id="storyMenu" class="screen"><div class="top-bar"><div><span style="font-size: 2rem;">📚</span><h2 style="display: inline-block; margin-left: 8px;">ESCOLHA UMA HISTÓRIA</h2></div><button class="back-button" onclick="goHome()">VOLTAR</button></div><div class="story-grid" id="storyList"></div></div>

        <!-- LEITURA -->
        <div id="storyScreen" class="screen"><div class="top-bar"><div style="display: flex; align-items: center; gap: 8px;"><span id="storyEmoji" style="font-size: 2.2rem; animation: wiggleEmoji 2s infinite;">🦢</span><h2 id="storyTitleDisplay" style="font-size: 1.6rem; text-transform: uppercase;">O PATINHO FEIO</h2></div><button class="back-button" onclick="openStoryMenu()">⬅ VOLTAR</button></div><div class="story-reader" id="storyBody"></div><div class="story-hint">🔊 TOQUE NA PALAVRA PARA OUVIR | 🔊 TOQUE NO ALTO-FALANTE PARA OUVIR A FRASE</div></div>

        <!-- DESENHO ANIMADO COM EMOJIS (corrigido) -->
        <div id="cartoonScreen" class="screen">
            <div class="top-bar"><div><span style="font-size: 2rem;">🎬</span><h2 style="display: inline-block; margin-left: 8px;">DESENHO ANIMADO</h2></div><button class="back-button" onclick="goHome()">SAIR</button></div>
            <div class="cartoon-screen" id="cartoonContainer">
                <div id="cartoonEmoji" class="cartoon-emoji">🐱</div>
                <div id="cartoonText" class="cartoon-text">ERA UMA VEZ...</div>
                <div id="cartoonProgress" class="cartoon-progress">CENA 1 / 6</div>
                <div class="cartoon-hint">✨ TOQUE NA TELA OU NO BOTÃO PARA AVANÇAR ✨</div>
                <button id="nextSceneBtn" class="btn-next-scene">➡️ PRÓXIMA CENA</button>
                <button id="resetCartoonBtn" class="back-button" style="margin-top: 0.5rem;">🔄 ASSISTIR NOVAMENTE</button>
            </div>
        </div>
    </div>
</div>

    function removeEmojis(text) { return text.replace(/[\p{Emoji}\p{Extended_Pictographic}]/gu, '').trim(); }
    let selectedVoice = null;
    function initVoice() { if(!window.speechSynthesis) return; const voices = window.speechSynthesis.getVoices(); selectedVoice = voices.find(v => (v.lang==='pt-BR'||v.lang==='pt') && (v.name.includes('Google')||v.name.includes('Microsoft')||v.name.includes('Samantha')||v.name.includes('Daniel')||v.name.includes('Maria'))); if(!selectedVoice) selectedVoice = voices.find(v => v.lang==='pt-BR'); }
    if(window.speechSynthesis){ window.speechSynthesis.onvoiceschanged = initVoice; initVoice(); }
    function speakText(text, slow=false){ if(!window.speechSynthesis) return; const clean=removeEmojis(text); if(!clean) return; window.speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(clean.toLowerCase()); u.lang='pt-BR'; u.rate=slow?0.72:0.82; u.pitch=1.08; u.volume=1; if(selectedVoice) u.voice=selectedVoice; window.speechSynthesis.speak(u); }
    function playCorrectSound(){ if(audioCtx.state==='suspended') audioCtx.resume(); [[523.25,0],[659.25,0.12]].forEach(([f,d])=>{ const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.type='triangle'; o.frequency.value=f; g.gain.setValueAtTime(0,audioCtx.currentTime+d); g.gain.linearRampToValueAtTime(0.15,audioCtx.currentTime+d+0.05); g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+d+0.3); o.connect(g); g.connect(audioCtx.destination); o.start(audioCtx.currentTime+d); o.stop(audioCtx.currentTime+d+0.4); }); }
    function playWrongSound(){ if(audioCtx.state==='suspended') audioCtx.resume(); [[220,0],[196,0.15]].forEach(([f,d])=>{ const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.type='sawtooth'; o.frequency.value=f; g.gain.setValueAtTime(0,audioCtx.currentTime+d); g.gain.linearRampToValueAtTime(0.1,audioCtx.currentTime+d+0.04); g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+d+0.3); o.connect(g); g.connect(audioCtx.destination); o.start(audioCtx.currentTime+d); o.stop(audioCtx.currentTime+d+0.32); }); }
    function shuffle(arr){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }
    function goHome(){ window.speechSynthesis.cancel(); document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); document.getElementById('homeScreen').classList.add('active'); }
    function startGame(cat){ if(audioCtx.state==='suspended') audioCtx.resume(); currentPool = cat==='nomes'?nomesWords:geralWords; order=shuffle([...Array(currentPool.length).keys()]); gameIndex=0; stars=0; answered=false; document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); document.getElementById('gameScreen').classList.add('active'); loadQuestion(); }
    function loadQuestion(){
        answered=false;
        const item = currentPool[order[gameIndex]];
        document.getElementById('phaseBadge').innerText = `FASE ${gameIndex+1} / ${currentPool.length}`;
        document.getElementById('starCounter').innerHTML = `⭐ ${stars}`;
        const imgBox = document.getElementById('imageBox');
        imgBox.innerText = item.emoji || '👤';
        imgBox.classList.add('pop');
        setTimeout(()=>imgBox.classList.remove('pop'),300);
        document.getElementById('vowelFocus').innerText = '?';
        document.getElementById('vowelFocus').className = 'vowel-card';
        document.getElementById('btnNext').style.display = 'none';
        document.getElementById('btnRestart').style.display = 'none';
        const disp = document.getElementById('wordDisplay');
        disp.innerHTML = '';
        item.palavra.split('').forEach((ch,i)=>{
            const span = document.createElement('span');
            span.style.margin = '0 2px';
            if(ch === ' '){
                span.innerText = ' ';
                span.style.width = '20px';
                span.style.display = 'inline-block';
                disp.appendChild(span);
            } else if(i === item.pos){
                span.innerText = '_';
                span.id = 'targetVowel';
                disp.appendChild(span);
            } else {
                span.innerText = ch;
                disp.appendChild(span);
            }
        });
        const cont = document.getElementById('choicesContainer');
        cont.innerHTML = '';
        ['A','E','I','O','U'].forEach(v=>{
            const btn = document.createElement('button');
            btn.className = 'choice-letter btn-modern';
            btn.innerText = v;
            btn.onclick = ()=>checkAnswer(v);
            cont.appendChild(btn);
        });
    }
    function checkAnswer(sel){
        if(answered) return;
        answered=true;
        const item = currentPool[order[gameIndex]];
        const isCorrect = (sel === item.vogal);
        const focus = document.getElementById('vowelFocus');
        focus.innerText = item.vogal;
        focus.classList.add(isCorrect?'correct':'wrong');
        if(isCorrect){
            stars++;
            document.getElementById('starCounter').innerHTML = `⭐ ${stars}`;
            const starDiv = document.getElementById('starCounter');
            starDiv.style.animation = 'none';
            starDiv.offsetHeight;
            starDiv.style.animation = 'starSpin 0.5s ease-out';
            setTimeout(()=>starDiv.style.animation='',500);
            const targetSpan = document.getElementById('targetVowel');
            if(targetSpan) targetSpan.innerText = item.vogal;
            playCorrectSound();
        } else {
            playWrongSound();
        }
        document.querySelectorAll('.choice-letter').forEach(btn=>{
            btn.disabled=true;
            if(btn.innerText===item.vogal) btn.classList.add('correct');
            else if(btn.innerText===sel && !isCorrect) btn.classList.add('wrong');
        });
        speakText(item.fala || item.palavra);
        if(gameIndex < currentPool.length-1){
            document.getElementById('btnNext').style.display = 'block';
        } else {
            setTimeout(()=>{
                focus.innerText='🏆';
                focus.classList.add('correct');
                document.getElementById('btnRestart').style.display='block';
            },1000);
        }
    }
    function nextQuestion(){ gameIndex++; loadQuestion(); }
    function openStoryMenu(){ if(audioCtx.state==='suspended') audioCtx.resume(); document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); document.getElementById('storyMenu').classList.add('active'); const grid=document.getElementById('storyList'); grid.innerHTML=''; stories.forEach((s,idx)=>{ const card=document.createElement('div'); card.className='story-card'; card.innerHTML=`<div class="story-emoji">${s.emoji}</div><div class="story-title">${s.title}</div>`; card.onclick=()=>openSelectedStory(idx); grid.appendChild(card); }); }
    function openSelectedStory(index){ currentStory=stories[index]; document.getElementById('storyTitleDisplay').innerText=currentStory.title; document.getElementById('storyEmoji').innerText=currentStory.emoji; document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); document.getElementById('storyScreen').classList.add('active'); renderStory(); }
    function renderStory(){ const body=document.getElementById('storyBody'); body.innerHTML=''; if(!currentStory) return; currentStory.paragraphs.forEach(paragraph=>{ const p=document.createElement('p'); p.className='story-paragraph'; const speaker=document.createElement('button'); speaker.innerText='🔊'; speaker.style.background='none'; speaker.style.border='none'; speaker.style.fontSize='1.4rem'; speaker.style.cursor='pointer'; speaker.style.marginRight='12px'; speaker.onclick=()=>speakText(paragraph); p.appendChild(speaker); const tokens=paragraph.split(/(\s+)/); tokens.forEach(token=>{ if(/^\s+$/.test(token)) p.appendChild(document.createTextNode(' ')); else{ const span=document.createElement('span'); span.className='story-word'; span.innerText=token; span.onclick=()=>{ const clean=removeEmojis(token); if(clean) speakText(clean,true); span.classList.add('story-word-active'); setTimeout(()=>span.classList.remove('story-word-active'),300); }; p.appendChild(span); } }); body.appendChild(p); }); }

    // ---------- DESENHO ANIMADO COM CORREÇÕES ----------
    let currentScene = 0;
    function loadScene(index){
        if(index >= cartoonScenes.length){
            document.getElementById('cartoonEmoji').innerHTML = "🏆🎉";
            document.getElementById('cartoonText').innerHTML = "FIM! VOCÊ ASSISTIU O DESENHO! 🥳";
            document.getElementById('cartoonProgress').innerHTML = `FIM / ${cartoonScenes.length} CENAS`;
            document.getElementById('nextSceneBtn').style.display = 'none';
            document.getElementById('resetCartoonBtn').style.display = 'inline-block';
            // remover classes extras
            document.getElementById('cartoonEmoji').classList.remove('climbing-mouse', 'last-scene-emoji');
            return;
        }
        const scene = cartoonScenes[index];
        const emojiDiv = document.getElementById('cartoonEmoji');
        // resetar classes
        emojiDiv.classList.remove('climbing-mouse', 'last-scene-emoji');
        emojiDiv.style.animation = 'cartoonBounce 0.8s infinite alternate ease-in-out';
        emojiDiv.innerHTML = scene.emoji;
        document.getElementById('cartoonText').innerHTML = scene.text;
        document.getElementById('cartoonProgress').innerHTML = `CENA ${index+1} / ${cartoonScenes.length}`;
        document.getElementById('nextSceneBtn').style.display = 'inline-block';
        document.getElementById('resetCartoonBtn').style.display = 'inline-block';
        
        // CENA 4 (índice 3): ratinho subindo no queijo → adicionar animação de subida
        if(index === 3 && scene.emoji.includes('🐭')){
            emojiDiv.classList.add('climbing-mouse');
            // após a animação, remove a classe (mas mantém a bounce)
            setTimeout(() => {
                emojiDiv.classList.remove('climbing-mouse');
            }, 1200);
        }
        // ÚLTIMA CENA (índice 5): emojis cortados? Vamos ajustar o tamanho
        if(index === 5){
            emojiDiv.classList.add('last-scene-emoji');
            // aumentar o container para não cortar
            emojiDiv.style.animation = 'none';
            emojiDiv.style.whiteSpace = 'nowrap';
            emojiDiv.style.fontSize = '5rem';
            // se for mobile, ajusta
            if(window.innerWidth < 700){
                emojiDiv.style.fontSize = '3rem';
            }
        } else {
            emojiDiv.style.whiteSpace = 'normal';
            emojiDiv.style.fontSize = ''; // volta ao padrão do CSS
        }
        
        speakText(scene.text);
    }
    function nextScene(){ if(currentScene < cartoonScenes.length-1){ currentScene++; loadScene(currentScene); } else { loadScene(cartoonScenes.length); } }
    function resetCartoon(){ currentScene = 0; loadScene(0); document.getElementById('nextSceneBtn').style.display = 'inline-block'; }
    function openCartoon(){ if(audioCtx.state==='suspended') audioCtx.resume(); currentScene = 0; document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); document.getElementById('cartoonScreen').classList.add('active'); loadScene(0); const nextBtn = document.getElementById('nextSceneBtn'); const resetBtn = document.getElementById('resetCartoonBtn'); const newNext = nextBtn.cloneNode(true); const newReset = resetBtn.cloneNode(true); nextBtn.parentNode.replaceChild(newNext, nextBtn); resetBtn.parentNode.replaceChild(newReset, resetBtn); newNext.onclick = () => nextScene(); newReset.onclick = () => resetCartoon(); }

    window.startGame = startGame; window.goHome = goHome; window.nextQuestion = nextQuestion; window.openStoryMenu = openStoryMenu; window.openSelectedStory = openSelectedStory; window.openCartoon = openCartoon; window.nextScene = nextScene; window.resetCartoon = resetCartoon;
